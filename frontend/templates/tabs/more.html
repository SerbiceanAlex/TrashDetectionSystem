<!-- ══ SETĂRI ══════════════════════════════════════════════════════════════ -->
<div x-show="activeTab === 'more'" x-cloak
  x-transition:enter="transition ease-out duration-200"
  x-transition:enter-start="opacity-0 translate-y-1"
  x-transition:enter-end="opacity-100 translate-y-0"
  class="space-y-4">

  <!-- Profil -->
  <div class="rounded-2xl p-5 flex items-center gap-4"
       style="background:linear-gradient(135deg,#064e3b 0%,#065f46 55%,#047857 100%);box-shadow:0 4px 24px rgba(5,150,105,.2)">
    <div class="w-14 h-14 rounded-2xl flex items-center justify-center text-xl font-black shrink-0"
         style="background:rgba(255,255,255,.15);color:#fff"
         x-text="user ? user.username.slice(0,2).toUpperCase() : '?'"></div>
    <div class="flex-1 min-w-0">
      <p class="text-base font-bold" style="color:#fff" x-text="user?.username ?? ''"></p>
      <p class="text-xs mt-0.5 uppercase tracking-widest" style="color:rgba(255,255,255,.6)"
         x-text="user?.role ?? ''"></p>
    </div>
    <button @click="logout()"
      class="flex items-center gap-2 px-3 py-2 rounded-xl text-xs font-semibold transition-all"
      style="background:rgba(255,255,255,.12);color:#fff">
      <i data-lucide="log-out" class="w-4 h-4"></i> Deconectare
    </button>
  </div>

  <!-- Info sistem -->
  <div class="rounded-2xl p-5" style="background:var(--card-bg);border:1px solid var(--border)">
    <p class="text-sm font-semibold mb-3" style="color:var(--text)">Sistem</p>
    <div class="space-y-2 text-sm" style="color:var(--text-muted)">
      <div class="flex justify-between">
        <span>Model detector</span>
        <span class="font-mono text-xs">A4-8010 (mAP50=0.687)</span>
      </div>
      <div class="flex justify-between">
        <span>Clasificator</span>
        <span class="font-mono text-xs">B2 (91.1%)</span>
      </div>
      <div class="flex justify-between">
        <span>Arhitectura</span>
        <span class="font-mono text-xs">YOLOv8s + YOLOv8n-cls</span>
      </div>
    </div>
  </div>

</div>
