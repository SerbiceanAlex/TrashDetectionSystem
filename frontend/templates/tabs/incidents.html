<!-- ══ Incidente Tab ════════════════════════════════════════════════════ -->
<div x-show="activeTab === 'incidents'" x-cloak
  x-transition:enter="transition ease-out duration-200"
  x-transition:enter-start="opacity-0 translate-y-2"
  x-transition:enter-end="opacity-100 translate-y-0"
  x-init="if(activeTab === 'incidents') loadIncidents()"
  x-data="{ incidentModal: null }">

  <!-- Header -->
  <div class="card" style="margin-bottom:16px;padding:16px;background:linear-gradient(135deg,rgba(239,68,68,.06),rgba(239,68,68,.01));border-left:4px solid #ef4444">
    <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
      <div style="width:48px;height:48px;border-radius:12px;background:rgba(239,68,68,.15);display:flex;align-items:center;justify-content:center">
        <i data-lucide="alert-triangle" class="icon icon--lg" style="color:#ef4444"></i>
      </div>
      <div style="flex:1;min-width:0">
        <h1 style="font-size:18px;font-weight:700;margin:0">Incidente detectate</h1>
        <p style="font-size:12px;color:var(--tx-secondary);margin:2px 0 0">Acte de aruncare ilegală — review, forward, descarcă dovezi</p>
      </div>
      <div style="display:flex;gap:8px">
        <button @click="exportIncidentsCSV()" class="btn btn--ghost" style="font-size:12px">
          <i data-lucide="download" class="icon icon--xs"></i> Export CSV
        </button>
        <button @click="loadIncidents()" class="btn btn--ghost" style="font-size:12px">
          <i data-lucide="refresh-cw" class="icon icon--xs"></i> Reîmprospătează
        </button>
      </div>
    </div>
  </div>

  <!-- KPI row -->
  <div class="kpi-grid mb-4">
    <div class="kpi-card" style="background:linear-gradient(135deg,rgba(245,158,11,.12),rgba(245,158,11,.04));cursor:pointer" @click="incidentStatusFilter='pending'; loadIncidents()">
      <span class="kpi-card__label"><i data-lucide="clock" class="icon icon--xs"></i> În așteptare</span>
      <span class="kpi-card__value" style="color:#f59e0b" x-text="incidentPending ?? 0"></span>
    </div>
    <div class="kpi-card" style="background:linear-gradient(135deg,rgba(16,185,129,.12),rgba(16,185,129,.04));cursor:pointer" @click="incidentStatusFilter='reviewed'; loadIncidents()">
      <span class="kpi-card__label"><i data-lucide="check" class="icon icon--xs"></i> Verificate</span>
      <span class="kpi-card__value" style="color:#10b981" x-text="incidents.filter(i=>i.status==='reviewed').length"></span>
    </div>
    <div class="kpi-card" style="background:linear-gradient(135deg,rgba(59,130,246,.12),rgba(59,130,246,.04));cursor:pointer" @click="incidentStatusFilter='forwarded'; loadIncidents()">
      <span class="kpi-card__label"><i data-lucide="send" class="icon icon--xs"></i> Trimise</span>
      <span class="kpi-card__value" style="color:#3b82f6" x-text="incidents.filter(i=>i.status==='forwarded').length"></span>
    </div>
    <div class="kpi-card" style="cursor:pointer" @click="incidentStatusFilter=''; loadIncidents()">
      <span class="kpi-card__label"><i data-lucide="archive" class="icon icon--xs"></i> Total</span>
      <span class="kpi-card__value" x-text="incidentTotal ?? 0"></span>
    </div>
  </div>

  <!-- Filtre vizuale — chips -->
  <div class="card" style="margin-bottom:16px;padding:14px">
    <!-- Status chips -->
    <div style="margin-bottom:10px">
      <span style="font-size:11px;font-weight:600;color:var(--tx-muted);display:block;margin-bottom:8px">STATUS</span>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        <button @click="incidentStatusFilter=''; loadIncidents()"
          class="btn" :class="incidentStatusFilter==='' ? 'btn--brand' : 'btn--ghost'"
          style="font-size:12px;padding:5px 12px;border-radius:20px">
          Toate
        </button>
        <button @click="incidentStatusFilter='pending'; loadIncidents()"
          class="btn" :class="incidentStatusFilter==='pending' ? 'btn--brand' : 'btn--ghost'"
          style="font-size:12px;padding:5px 12px;border-radius:20px;color:#f59e0b"
          :style="incidentStatusFilter==='pending' ? '' : 'border-color:rgba(245,158,11,.4);color:#f59e0b'">
          <i data-lucide="clock" class="icon icon--xs"></i> În așteptare
          <span x-show="incidentPending > 0" class="badge" style="background:rgba(245,158,11,.2);color:#f59e0b;margin-left:4px;font-size:10px" x-text="incidentPending"></span>
        </button>
        <button @click="incidentStatusFilter='reviewed'; loadIncidents()"
          class="btn" :class="incidentStatusFilter==='reviewed' ? 'btn--brand' : 'btn--ghost'"
          style="font-size:12px;padding:5px 12px;border-radius:20px">
          <i data-lucide="check" class="icon icon--xs"></i> Verificate
        </button>
        <button @click="incidentStatusFilter='forwarded'; loadIncidents()"
          class="btn" :class="incidentStatusFilter==='forwarded' ? 'btn--brand' : 'btn--ghost'"
          style="font-size:12px;padding:5px 12px;border-radius:20px">
          <i data-lucide="send" class="icon icon--xs"></i> Trimise
        </button>
        <button @click="incidentStatusFilter='dismissed'; loadIncidents()"
          class="btn" :class="incidentStatusFilter==='dismissed' ? 'btn--brand' : 'btn--ghost'"
          style="font-size:12px;padding:5px 12px;border-radius:20px">
          <i data-lucide="x" class="icon icon--xs"></i> Respinse
        </button>
      </div>
    </div>

    <!-- Material chips -->
    <div>
      <span style="font-size:11px;font-weight:600;color:var(--tx-muted);display:block;margin-bottom:8px">MATERIAL</span>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        <template x-for="mat in ['', 'plastic', 'paper', 'glass', 'metal', 'other', 'unknown']" :key="mat">
          <button @click="incidentMaterialFilter=mat; loadIncidents()"
            class="btn" :class="incidentMaterialFilter===mat ? 'btn--brand' : 'btn--ghost'"
            style="font-size:12px;padding:5px 12px;border-radius:20px;text-transform:capitalize"
            x-text="mat === '' ? 'Toate' : mat === 'paper' ? 'Hârtie' : mat === 'glass' ? 'Sticlă' : mat">
          </button>
        </template>
      </div>
    </div>
  </div>

  <!-- Loading -->
  <div x-show="incidentsLoading" class="skeleton" style="height:200px;border-radius:12px"></div>

  <!-- Empty state -->
  <template x-if="!incidentsLoading && incidents.length === 0">
    <div class="empty-state" style="padding:48px 20px">
      <div class="empty-state__icon" style="background:rgba(34,197,94,.12);color:#22c55e">
        <i data-lucide="shield-check" class="icon icon--2xl"></i>
      </div>
      <p class="empty-state__text" style="font-size:15px;font-weight:600">Niciun incident</p>
      <p style="font-size:12px;color:var(--tx-muted);margin-top:6px">Sistemul monitorizează automat. Alertele vor apărea aici.</p>
    </div>
  </template>

  <!-- Incidents list -->
  <div x-show="!incidentsLoading && incidents.length > 0" style="display:flex;flex-direction:column;gap:10px">
    <template x-for="ev in incidents" :key="ev.id">
      <div class="card card--elevated"
        style="padding:14px;cursor:pointer;transition:box-shadow .15s"
        @click="incidentModal = ev"
        @mouseenter="$el.style.boxShadow='0 4px 24px rgba(239,68,68,.12)'"
        @mouseleave="$el.style.boxShadow=''">
        <div style="display:flex;gap:12px;align-items:flex-start">

          <!-- Thumbnail -->
          <div style="position:relative;flex-shrink:0">
            <template x-if="ev.thumbnail_path">
              <img :src="'/littering/' + ev.thumbnail_path"
                style="width:100px;height:72px;object-fit:cover;border-radius:10px;border:1px solid var(--bg-border)" />
            </template>
            <template x-if="!ev.thumbnail_path">
              <div style="width:100px;height:72px;background:var(--bg-raised);border-radius:10px;display:flex;align-items:center;justify-content:center;border:1px solid var(--bg-border)">
                <i data-lucide="video-off" class="icon icon--md" style="color:var(--tx-muted)"></i>
              </div>
            </template>
            <!-- Play icon overlay if clip exists -->
            <template x-if="ev.clip_path">
              <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none">
                <div style="width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center">
                  <i data-lucide="play" class="icon icon--xs" style="color:white;margin-left:2px"></i>
                </div>
              </div>
            </template>
          </div>

          <!-- Info -->
          <div style="flex:1;min-width:0">
            <div style="display:flex;align-items:center;gap:6px;margin-bottom:5px;flex-wrap:wrap">
              <span class="badge"
                :style="ev.status==='pending' ? 'background:rgba(245,158,11,.18);color:#f59e0b' : ev.status==='reviewed' ? 'background:rgba(16,185,129,.18);color:#10b981' : ev.status==='forwarded' ? 'background:rgba(59,130,246,.18);color:#3b82f6' : 'background:rgba(107,114,128,.18);color:#6b7280'"
                x-text="ev.status==='pending' ? 'În așteptare' : ev.status==='reviewed' ? 'Verificat' : ev.status==='forwarded' ? 'Trimis' : 'Respins'"></span>
              <span class="badge badge--blue" style="text-transform:capitalize" x-text="ev.material || 'unknown'"></span>
              <span style="font-size:11px;color:var(--tx-muted)"
                x-text="(ev.det_score * 100).toFixed(0) + '% conf.'"></span>
              <template x-if="ev.proximity_score !== null && ev.proximity_score !== undefined">
                <span style="font-size:10px;padding:2px 6px;border-radius:6px"
                  :style="ev.proximity_score > 0.5 ? 'background:rgba(16,185,129,.15);color:#10b981' : 'background:rgba(245,158,11,.15);color:#f59e0b'"
                  :title="'Proximitate: ' + (ev.proximity_score*100).toFixed(0) + '%'"
                  x-text="'prox.' + (ev.proximity_score*100).toFixed(0) + '%'"></span>
              </template>
              <span style="font-size:11px;color:var(--tx-muted);margin-left:auto;font-family:monospace" x-text="'#' + ev.id"></span>
            </div>
            <div style="font-size:13px;font-weight:600;color:var(--tx-primary)"
              x-text="new Date((ev.detected_at||'').replace(' ','T')+(ev.detected_at&&!ev.detected_at.includes('+')&&!ev.detected_at.endsWith('Z')?'Z':'')).toLocaleString('ro-RO',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})"></div>
            <template x-if="ev.address">
              <div style="font-size:12px;color:var(--tx-secondary);display:flex;align-items:center;gap:4px;margin-top:3px">
                <i data-lucide="map-pin" class="icon icon--xs"></i>
                <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap" x-text="ev.address"></span>
              </div>
            </template>
          </div>

          <!-- Quick action buttons (nu propagă click la modal) -->
          <div style="display:flex;flex-direction:column;gap:6px;flex-shrink:0" @click.stop>
            <button x-show="ev.status==='pending'" @click="markIncidentReviewed(ev.id)"
              class="btn btn--ghost" style="font-size:11px;padding:4px 10px;color:#10b981">
              <i data-lucide="check" class="icon icon--xs"></i>
            </button>
            <button x-show="ev.status!=='forwarded' && ev.status!=='dismissed'"
              @click="forwardIncident(ev.id)"
              class="btn btn--ghost" style="font-size:11px;padding:4px 10px;color:#3b82f6">
              <i data-lucide="send" class="icon icon--xs"></i>
            </button>
          </div>
        </div>
      </div>
    </template>
  </div>

  <!-- Pagination -->
  <div x-show="incidentTotal > incidentLimit" style="display:flex;justify-content:center;gap:8px;margin-top:20px;align-items:center">
    <button @click="incidentPage=Math.max(0,incidentPage-1); loadIncidents()"
      :disabled="incidentPage===0" class="btn btn--ghost" style="font-size:12px;padding:6px 14px">
      <i data-lucide="chevron-left" class="icon icon--xs"></i> Anterior
    </button>
    <span style="font-size:12px;color:var(--tx-secondary)"
      x-text="'Pagina '+(incidentPage+1)+' din '+Math.ceil(incidentTotal/incidentLimit)"></span>
    <button @click="incidentPage++; loadIncidents()"
      :disabled="(incidentPage+1)*incidentLimit>=incidentTotal"
      class="btn btn--ghost" style="font-size:12px;padding:6px 14px">
      Următor <i data-lucide="chevron-right" class="icon icon--xs"></i>
    </button>
  </div>

  <!-- ══ MODAL DETALII INCIDENT ════════════════════════════════════════ -->
  <div x-show="incidentModal" x-cloak @click="incidentModal=null"
    style="position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:300;display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(4px)"
    x-transition:enter="transition ease-out duration-200"
    x-transition:enter-start="opacity-0"
    x-transition:enter-end="opacity-100">
    <div @click.stop class="card"
      style="max-width:640px;width:100%;max-height:90vh;overflow-y:auto;padding:0;border-radius:16px">

      <!-- Modal header -->
      <div style="display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--bg-border)">
        <div style="display:flex;align-items:center;gap:10px">
          <i data-lucide="alert-triangle" class="icon icon--md" style="color:#ef4444"></i>
          <div>
            <h2 style="font-size:16px;font-weight:700;margin:0" x-text="'Incident #' + (incidentModal?.id ?? '')"></h2>
            <p style="font-size:11px;color:var(--tx-muted);margin:2px 0 0"
              x-text="new Date(((incidentModal?.detected_at||'').replace(' ','T')+(incidentModal?.detected_at&&!incidentModal.detected_at.includes('+')&&!incidentModal.detected_at.endsWith('Z')?'Z':''))).toLocaleString('ro-RO',{dateStyle:'long',timeStyle:'short'})"></p>
          </div>
        </div>
        <button @click="incidentModal=null" class="btn btn--ghost" style="padding:6px">
          <i data-lucide="x" class="icon icon--md"></i>
        </button>
      </div>

      <!-- Video player -->
      <template x-if="incidentModal?.clip_path">
        <div style="background:#000;position:relative">
          <video :src="'/littering/' + incidentModal.clip_path"
            controls preload="metadata"
            style="width:100%;max-height:360px;display:block">
          </video>
        </div>
      </template>
      <template x-if="!incidentModal?.clip_path && incidentModal?.thumbnail_path">
        <div style="background:#000;display:flex;align-items:center;justify-content:center;height:200px">
          <img :src="'/littering/' + incidentModal.thumbnail_path"
            style="max-height:200px;max-width:100%;object-fit:contain" />
        </div>
      </template>

      <!-- Modal body -->
      <div style="padding:20px">

        <!-- Status + badges -->
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px">
          <span class="badge"
            :style="incidentModal?.status==='pending' ? 'background:rgba(245,158,11,.18);color:#f59e0b' : incidentModal?.status==='reviewed' ? 'background:rgba(16,185,129,.18);color:#10b981' : incidentModal?.status==='forwarded' ? 'background:rgba(59,130,246,.18);color:#3b82f6' : 'background:rgba(107,114,128,.18);color:#6b7280'"
            x-text="incidentModal?.status==='pending' ? 'În așteptare' : incidentModal?.status==='reviewed' ? 'Verificat' : incidentModal?.status==='forwarded' ? 'Trimis autorității' : 'Respins'"></span>
          <span class="badge badge--blue" style="text-transform:capitalize" x-text="incidentModal?.material || 'unknown'"></span>
        </div>

        <!-- Metrics grid -->
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px">
          <div style="background:var(--bg-raised);padding:12px;border-radius:10px">
            <div style="font-size:10px;color:var(--tx-muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px">Confidență detecție</div>
            <div style="font-size:22px;font-weight:700;color:var(--tx-primary)"
              x-text="incidentModal ? (incidentModal.det_score*100).toFixed(0)+'%' : '—'"></div>
          </div>
          <div style="background:var(--bg-raised);padding:12px;border-radius:10px">
            <div style="font-size:10px;color:var(--tx-muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px">Proximitate persoană</div>
            <div style="font-size:22px;font-weight:700"
              :style="incidentModal?.proximity_score > 0.5 ? 'color:#10b981' : 'color:#f59e0b'"
              x-text="incidentModal?.proximity_score != null ? (incidentModal.proximity_score*100).toFixed(0)+'%' : '—'"></div>
          </div>
          <div style="background:var(--bg-raised);padding:12px;border-radius:10px">
            <div style="font-size:10px;color:var(--tx-muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px">Metodă detecție</div>
            <div style="font-size:13px;font-weight:600;color:var(--tx-primary)" x-text="incidentModal?.detection_method || 'zone'"></div>
          </div>
          <div style="background:var(--bg-raised);padding:12px;border-radius:10px">
            <div style="font-size:10px;color:var(--tx-muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px">Persoane prezente</div>
            <div style="font-size:22px;font-weight:700;color:var(--tx-primary)" x-text="incidentModal?.person_count ?? '—'"></div>
          </div>
        </div>

        <!-- Location -->
        <template x-if="incidentModal?.address">
          <div style="display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--bg-raised);border-radius:10px;margin-bottom:16px">
            <i data-lucide="map-pin" class="icon icon--sm" style="color:var(--eco-green-dark);flex-shrink:0"></i>
            <span style="font-size:13px;color:var(--tx-primary)" x-text="incidentModal.address"></span>
          </div>
        </template>

        <!-- Hash evidență GDPR -->
        <template x-if="incidentModal?.image_hash">
          <div style="padding:10px 12px;background:var(--bg-raised);border-radius:10px;margin-bottom:16px">
            <div style="font-size:10px;color:var(--tx-muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px">SHA-256 evidență (GDPR chain-of-custody)</div>
            <div style="font-family:monospace;font-size:11px;color:var(--tx-secondary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap" x-text="incidentModal.image_hash"></div>
          </div>
        </template>

        <!-- Acțiuni -->
        <div style="display:flex;flex-wrap:wrap;gap:8px;padding-top:16px;border-top:1px solid var(--bg-border)">
          <template x-if="incidentModal?.clip_path">
            <a :href="'/littering/' + incidentModal.clip_path"
              class="btn btn--ghost" style="font-size:13px;padding:8px 14px" download>
              <i data-lucide="download" class="icon icon--sm"></i> Descarcă clip
            </a>
          </template>
          <button x-show="incidentModal?.status==='pending'"
            @click="markIncidentReviewed(incidentModal.id); incidentModal.status='reviewed'"
            class="btn btn--ghost" style="font-size:13px;padding:8px 14px;color:#10b981">
            <i data-lucide="check" class="icon icon--sm"></i> Marchează verificat
          </button>
          <button x-show="incidentModal?.status!=='forwarded' && incidentModal?.status!=='dismissed'"
            @click="forwardIncident(incidentModal.id); incidentModal.status='forwarded'"
            class="btn btn--ghost" style="font-size:13px;padding:8px 14px;color:#3b82f6">
            <i data-lucide="send" class="icon icon--sm"></i> Trimite autorității
          </button>
          <button x-show="incidentModal?.status!=='dismissed'"
            @click="dismissIncident(incidentModal.id); incidentModal.status='dismissed'"
            class="btn btn--ghost" style="font-size:13px;padding:8px 14px;color:var(--tx-muted)">
            <i data-lucide="x" class="icon icon--sm"></i> Respinge
          </button>
        </div>
      </div>
    </div>
  </div>

</div>
