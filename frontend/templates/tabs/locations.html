<!-- ══ LOCAȚII ════════════════════════════════════════════════════════════ -->
<div x-show="activeTab === 'locations'" x-cloak
  x-transition:enter="transition ease-out duration-200"
  x-transition:enter-start="opacity-0 translate-y-1"
  x-transition:enter-end="opacity-100 translate-y-0"
  x-init="if(activeTab==='locations') loadLocations()"
  class="space-y-4">

  <!-- ── Hero ──────────────────────────────────────────────────────────── -->
  <div class="rounded-2xl p-5 flex items-center gap-4 flex-wrap"
       style="background:linear-gradient(135deg,#064e3b 0%,#065f46 55%,#047857 100%);box-shadow:0 4px 24px rgba(5,150,105,.25)">
    <div class="w-11 h-11 rounded-xl flex items-center justify-center shrink-0"
         style="background:rgba(255,255,255,.12)">
      <i data-lucide="map-pin" class="w-5 h-5" style="color:#fff"></i>
    </div>
    <div class="flex-1 min-w-0">
      <p class="text-base font-bold" style="color:#fff">Locații monitorizate</p>
      <p class="text-sm mt-0.5" style="color:rgba(255,255,255,.65)">Camere IP (RTSP) · monitorizare automată 24/7</p>
    </div>
    <button @click="locationModalOpen=true; locationEdit=null; locationForm={name:'',address:'',lat:null,lng:null,rtsp_url:'',alert_email:'',is_active:true}"
      class="flex items-center gap-2 px-4 py-2 rounded-xl text-sm font-semibold transition-all whitespace-nowrap"
      style="background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff"
      @mouseenter="$el.style.background='rgba(255,255,255,.25)'"
      @mouseleave="$el.style.background='rgba(255,255,255,.15)'">
      <i data-lucide="plus" class="w-4 h-4"></i> Adaugă locație
    </button>
  </div>

  <!-- ── Loading skeleton ───────────────────────────────────────────────── -->
  <div x-show="locationsLoading" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
    <template x-for="i in [1,2,3,4]" :key="i">
      <div class="rounded-2xl overflow-hidden animate-pulse" style="background:var(--bg-surface);border:1px solid var(--bg-border)">
        <div class="h-24" style="background:var(--bg-raised)"></div>
        <div class="p-4 space-y-3">
          <div class="h-4 rounded" style="background:var(--bg-border);width:60%"></div>
          <div class="h-3 rounded" style="background:var(--bg-border);width:80%"></div>
          <div class="grid grid-cols-3 gap-2 mt-4">
            <div class="h-10 rounded-xl" style="background:var(--bg-border)"></div>
            <div class="h-10 rounded-xl" style="background:var(--bg-border)"></div>
            <div class="h-10 rounded-xl" style="background:var(--bg-border)"></div>
          </div>
        </div>
      </div>
    </template>
  </div>

  <!-- ── Empty state ────────────────────────────────────────────────────── -->
  <template x-if="!locationsLoading && (!locations || locations.length === 0)">
    <div class="rounded-2xl py-16 text-center" style="background:var(--bg-surface);border:2px dashed var(--bg-border)">
      <div class="w-20 h-20 rounded-2xl mx-auto mb-5 flex items-center justify-center"
           style="background:rgba(16,185,129,.08)">
        <i data-lucide="map-pin" class="w-10 h-10" style="color:var(--eco-green-dark);opacity:.5"></i>
      </div>
      <p class="text-base font-bold mb-2" style="color:var(--tx-primary)">Nicio locație configurată</p>
      <p class="text-sm mx-auto mb-6" style="color:var(--tx-muted);max-width:320px;line-height:1.6">
        Adaugă prima locație cu adresa și URL-ul RTSP. Sistemul monitorizează automat 24/7.
      </p>
      <button @click="locationModalOpen=true; locationEdit=null; locationForm={name:'',address:'',lat:null,lng:null,rtsp_url:'',alert_email:'',is_active:true}"
        class="inline-flex items-center gap-2 px-5 py-2.5 rounded-xl text-sm font-bold"
        style="background:var(--eco-green-dark);color:#fff;box-shadow:0 4px 16px rgba(5,150,105,.3)">
        <i data-lucide="plus" class="w-4 h-4"></i> Adaugă prima locație
      </button>
    </div>
  </template>

  <!-- ── Grid locații ───────────────────────────────────────────────────── -->
  <template x-if="!locationsLoading && locations && locations.length > 0">
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <template x-for="loc in (locations||[])" :key="loc.id">
        <div class="rounded-2xl overflow-hidden transition-all duration-200"
             style="background:var(--bg-surface);border:1px solid var(--bg-border);box-shadow:0 1px 6px rgba(0,0,0,.05)"
             @mouseenter="$el.style.boxShadow='0 4px 20px rgba(5,150,105,.1)';$el.style.borderColor='rgba(16,185,129,.3)'"
             @mouseleave="$el.style.boxShadow='0 1px 6px rgba(0,0,0,.05)';$el.style.borderColor='var(--bg-border)'">

          <!-- Card top — preview area cu status -->
          <div class="relative"
               :style="loc.is_active
                 ? 'height:80px;background:linear-gradient(135deg,#064e3b,#065f46)'
                 : darkMode ? 'height:80px;background:linear-gradient(135deg,#1f2937,#111827)' : 'height:80px;background:linear-gradient(135deg,#e5e7eb,#d1d5db)'">

            <!-- Status badge -->
            <div class="absolute top-3 left-3 flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[10px] font-bold"
                 :style="loc.is_active
                   ? 'background:rgba(0,0,0,.5);color:#4ade80;border:1px solid rgba(74,222,128,.4)'
                   : darkMode
                     ? 'background:rgba(0,0,0,.45);color:#94a3b8;border:1px solid rgba(148,163,184,.25)'
                     : 'background:rgba(71,85,105,.85);color:#fff;border:1px solid #475569'">
              <span class="w-1.5 h-1.5 rounded-full"
                :style="loc.is_active ? 'background:#4ade80;box-shadow:0 0 5px #4ade80' : (darkMode?'background:#94a3b8':'background:#fff')"></span>
              <span x-text="loc.is_active ? 'ACTIVĂ' : 'INACTIVĂ'"></span>
            </div>

            <!-- ID badge -->
            <div class="absolute top-3 right-3 px-2 py-0.5 rounded-full text-[10px] font-mono"
                 :style="loc.is_active ? 'background:rgba(0,0,0,.35);color:rgba(255,255,255,.55)' : (darkMode?'background:rgba(0,0,0,.35);color:rgba(255,255,255,.5)':'background:rgba(71,85,105,.7);color:#fff')">
              <span x-text="'#' + loc.id"></span>
            </div>

            <!-- Pending alert badge -->
            <template x-if="loc.pending_count > 0">
              <div class="absolute bottom-3 left-3 flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-bold"
                   style="background:rgba(245,158,11,.25);border:1px solid rgba(245,158,11,.4);color:#fbbf24">
                <i data-lucide="clock" style="width:9px;height:9px"></i>
                <span x-text="loc.pending_count + ' nev.'"></span>
              </div>
            </template>

            <!-- Camera icon -->
            <div class="absolute inset-0 flex items-center justify-center"
                 :style="loc.is_active ? 'opacity:.15' : 'opacity:.12'">
              <i data-lucide="cctv" class="w-14 h-14"
                 :style="loc.is_active ? 'color:#fff' : darkMode ? 'color:#fff' : 'color:#6b7280'"></i>
            </div>
          </div>

          <!-- Card body -->
          <div class="p-4">
            <!-- Nume + adresă -->
            <h3 class="text-sm font-bold mb-0.5 truncate" style="color:var(--tx-primary)" x-text="loc.name"></h3>
            <p class="text-xs flex items-center gap-1 mb-3 truncate" style="color:var(--tx-muted)">
              <i data-lucide="map-pin" class="w-3 h-3 shrink-0" style="color:#ef4444"></i>
              <span x-text="loc.address || 'Fără adresă'"></span>
            </p>

            <!-- RTSP URL -->
            <div class="flex items-center gap-2 px-3 py-2 rounded-xl mb-3 text-[11px] font-mono overflow-hidden"
                 style="background:var(--bg-raised);border:1px solid var(--bg-border);color:var(--tx-muted)">
              <i data-lucide="wifi" class="w-3 h-3 shrink-0"
                 :style="loc.rtsp_url ? 'color:#10b981' : 'color:var(--tx-muted)'"></i>
              <span class="truncate" x-text="loc.rtsp_url || 'Fără stream RTSP'"></span>
            </div>

            <!-- Stats row -->
            <div class="grid grid-cols-3 gap-2 mb-4">
              <div class="text-center py-2 rounded-xl" style="background:var(--bg-raised);border:1px solid var(--bg-border)">
                <p class="text-xl font-extrabold leading-none mb-0.5" style="color:var(--tx-primary)"
                   x-text="loc.incidents_count || 0"></p>
                <p class="text-[9px] uppercase tracking-wide" style="color:var(--tx-muted)">Incidente</p>
              </div>
              <div class="text-center py-2 rounded-xl" style="background:var(--bg-raised);border:1px solid var(--bg-border)">
                <p class="text-xl font-extrabold leading-none mb-0.5"
                   :style="loc.pending_count > 0 ? 'color:#f59e0b' : 'color:var(--tx-primary)'"
                   x-text="loc.pending_count || 0"></p>
                <p class="text-[9px] uppercase tracking-wide" style="color:var(--tx-muted)">Așteptare</p>
              </div>
              <div class="text-center py-2 rounded-xl" style="background:var(--bg-raised);border:1px solid var(--bg-border)">
                <p class="text-xs font-bold leading-none mb-0.5" style="color:var(--tx-secondary)"
                   x-text="loc.last_event_at ? new Date(loc.last_event_at+'Z').toLocaleDateString('ro-RO',{day:'2-digit',month:'short'}) : '—'"></p>
                <p class="text-[9px] uppercase tracking-wide" style="color:var(--tx-muted)">Ultim ev.</p>
              </div>
            </div>

            <!-- Email alertă -->
            <template x-if="loc.alert_email">
              <div class="flex items-center gap-2 px-3 py-2 rounded-xl mb-3 text-[11px] overflow-hidden"
                   style="background:rgba(16,185,129,.06);border:1px solid rgba(16,185,129,.15);color:var(--tx-secondary)">
                <i data-lucide="mail" class="w-3 h-3 shrink-0" style="color:#10b981"></i>
                <span class="truncate" x-text="loc.alert_email"></span>
              </div>
            </template>

            <!-- Actions -->
            <div class="flex gap-2">
              <button @click="locationEdit=loc; locationModalOpen=true; locationForm={name:loc.name,address:loc.address||'',lat:loc.lat,lng:loc.lng,rtsp_url:loc.rtsp_url||'',alert_email:loc.alert_email||'',is_active:loc.is_active}"
                class="flex-1 flex items-center justify-center gap-1.5 py-2 rounded-xl text-xs font-semibold transition-all"
                style="background:var(--bg-raised);border:1px solid var(--bg-border);color:var(--tx-secondary)"
                @mouseenter="$el.style.borderColor='var(--eco-green-dark)';$el.style.color='var(--eco-green-dark)'"
                @mouseleave="$el.style.borderColor='var(--bg-border)';$el.style.color='var(--tx-secondary)'">
                <i data-lucide="edit-3" class="w-3.5 h-3.5"></i> Editează
              </button>
              <button @click="toggleLocation(loc)"
                class="flex-1 flex items-center justify-center gap-1.5 py-2 rounded-xl text-xs font-semibold transition-all"
                :style="loc.is_active
                  ? ('background:rgba(107,114,128,.08);border:1px solid rgba(107,114,128,.2);color:'+(darkMode?'#9ca3af':'#64748b'))
                  : ('background:rgba(16,185,129,.08);border:1px solid rgba(16,185,129,.2);color:'+(darkMode?'#10b981':'#047857'))"
                @mouseenter="$el.style.opacity='.8'"
                @mouseleave="$el.style.opacity='1'">
                <i :data-lucide="loc.is_active ? 'pause-circle' : 'play-circle'" class="w-3.5 h-3.5"></i>
                <span x-text="loc.is_active ? 'Oprește' : 'Pornește'"></span>
              </button>
              <button @click="deleteLocation(loc)"
                class="w-9 h-9 flex items-center justify-center rounded-xl transition-all shrink-0"
                style="background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.15);color:#f87171"
                title="Șterge locație"
                @mouseenter="$el.style.background='rgba(239,68,68,.18)'"
                @mouseleave="$el.style.background='rgba(239,68,68,.08)'">
                <i data-lucide="trash-2" class="w-4 h-4"></i>
              </button>
            </div>
          </div>
        </div>
      </template>
    </div>
  </template>

  <!-- ══ MODAL ADAUGĂ / EDITEAZĂ ══════════════════════════════════════════ -->
  <div x-show="locationModalOpen" x-cloak
    @click="locationModalOpen=false"
    class="fixed inset-0 z-[300] flex items-end sm:items-center justify-center p-4 sm:p-6"
    style="background:rgba(0,0,0,.65);backdrop-filter:blur(6px)"
    x-transition:enter="transition ease-out duration-200"
    x-transition:enter-start="opacity-0"
    x-transition:enter-end="opacity-100">

    <div @click.stop
      class="w-full rounded-2xl overflow-hidden"
      style="max-width:500px;max-height:92vh;overflow-y:auto;background:var(--bg-surface);border:1px solid var(--bg-border);box-shadow:0 24px 64px rgba(0,0,0,.4)"
      x-transition:enter="transition ease-out duration-250"
      x-transition:enter-start="opacity-0 translate-y-4 scale-95"
      x-transition:enter-end="opacity-100 translate-y-0 scale-100">

      <!-- Modal header -->
      <div class="flex items-center justify-between px-5 py-4"
           style="border-bottom:1px solid var(--bg-border);background:var(--bg-raised)">
        <div class="flex items-center gap-3">
          <div class="w-9 h-9 rounded-xl flex items-center justify-center"
               style="background:rgba(16,185,129,.12)">
            <i data-lucide="map-pin" class="w-4 h-4" style="color:var(--eco-green-dark)"></i>
          </div>
          <p class="text-sm font-bold" style="color:var(--tx-primary)"
             x-text="locationEdit ? 'Editează locație' : 'Adaugă locație nouă'"></p>
        </div>
        <button @click="locationModalOpen=false"
          class="w-8 h-8 rounded-xl flex items-center justify-center transition-all"
          style="background:rgba(239,68,68,.08);color:#ef4444;border:1px solid rgba(239,68,68,.2)"
          @mouseenter="$el.style.background='rgba(239,68,68,.18)'"
          @mouseleave="$el.style.background='rgba(239,68,68,.08)'">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>

      <!-- Form -->
      <form @submit.prevent="saveLocation()" class="p-5 space-y-4">

        <!-- Nume -->
        <div>
          <label class="block text-xs font-semibold mb-1.5" style="color:var(--tx-secondary)">
            Nume locație <span style="color:#ef4444">*</span>
          </label>
          <input type="text" x-model="locationForm.name" required
            placeholder="ex: Parcare Mall AFI Cotroceni"
            class="w-full px-3 py-2.5 rounded-xl text-sm transition-all outline-none"
            style="border:1px solid var(--bg-border);background:var(--bg-raised);color:var(--tx-primary)"
            @focus="$el.style.borderColor='var(--eco-green-dark)';$el.style.boxShadow='0 0 0 3px rgba(16,185,129,.12)'"
            @blur="$el.style.borderColor='var(--bg-border)';$el.style.boxShadow=''"/>
        </div>

        <!-- Adresă -->
        <div>
          <label class="block text-xs font-semibold mb-1.5" style="color:var(--tx-secondary)">Adresă completă</label>
          <input type="text" x-model="locationForm.address"
            placeholder="ex: Bd. Vasile Milea 4, București"
            class="w-full px-3 py-2.5 rounded-xl text-sm transition-all outline-none"
            style="border:1px solid var(--bg-border);background:var(--bg-raised);color:var(--tx-primary)"
            @focus="$el.style.borderColor='var(--eco-green-dark)';$el.style.boxShadow='0 0 0 3px rgba(16,185,129,.12)'"
            @blur="$el.style.borderColor='var(--bg-border)';$el.style.boxShadow=''"/>
        </div>

        <!-- GPS -->
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold mb-1.5" style="color:var(--tx-secondary)">Latitudine</label>
            <input type="number" step="0.000001" x-model.number="locationForm.lat" placeholder="44.4268"
              class="w-full px-3 py-2.5 rounded-xl text-sm transition-all outline-none"
              style="border:1px solid var(--bg-border);background:var(--bg-raised);color:var(--tx-primary)"
              @focus="$el.style.borderColor='var(--eco-green-dark)'"
              @blur="$el.style.borderColor='var(--bg-border)'"/>
          </div>
          <div>
            <label class="block text-xs font-semibold mb-1.5" style="color:var(--tx-secondary)">Longitudine</label>
            <input type="number" step="0.000001" x-model.number="locationForm.lng" placeholder="26.1025"
              class="w-full px-3 py-2.5 rounded-xl text-sm transition-all outline-none"
              style="border:1px solid var(--bg-border);background:var(--bg-raised);color:var(--tx-primary)"
              @focus="$el.style.borderColor='var(--eco-green-dark)'"
              @blur="$el.style.borderColor='var(--bg-border)'"/>
          </div>
        </div>

        <!-- RTSP URL -->
        <div>
          <label class="block text-xs font-semibold mb-1.5" style="color:var(--tx-secondary)">
            URL Stream RTSP <span class="font-normal" style="color:var(--tx-muted)">(opțional)</span>
          </label>
          <input type="text" x-model="locationForm.rtsp_url"
            placeholder="rtsp://user:pass@192.168.1.100:554/Streaming/Channels/101"
            class="w-full px-3 py-2.5 rounded-xl text-xs font-mono transition-all outline-none"
            style="border:1px solid var(--bg-border);background:var(--bg-raised);color:var(--tx-primary)"
            @focus="$el.style.borderColor='var(--eco-green-dark)'"
            @blur="$el.style.borderColor='var(--bg-border)'"/>
          <p class="text-[11px] mt-1.5 flex items-center gap-1" style="color:var(--tx-muted)">
            <i data-lucide="info" class="w-3 h-3"></i>
            Suport: Hikvision, Dahua, ONVIF. Lasă gol pentru webcam browser.
          </p>
        </div>

        <!-- Email alertă -->
        <div>
          <label class="block text-xs font-semibold mb-1.5" style="color:var(--tx-secondary)">
            Email alertă <span class="font-normal" style="color:var(--tx-muted)">(la fiecare incident)</span>
          </label>
          <input type="email" x-model="locationForm.alert_email"
            placeholder="securitate@locatie.ro"
            class="w-full px-3 py-2.5 rounded-xl text-sm transition-all outline-none"
            style="border:1px solid var(--bg-border);background:var(--bg-raised);color:var(--tx-primary)"
            @focus="$el.style.borderColor='var(--eco-green-dark)'"
            @blur="$el.style.borderColor='var(--bg-border)'"/>
        </div>

        <!-- Activă toggle -->
        <div class="flex items-center gap-3 p-3 rounded-xl"
             style="background:rgba(16,185,129,.06);border:1px solid rgba(16,185,129,.15)">
          <button type="button" @click="locationForm.is_active = !locationForm.is_active"
            class="relative shrink-0 w-10 h-6 rounded-full transition-all duration-200"
            :style="locationForm.is_active ? 'background:var(--eco-green-dark)' : 'background:var(--bg-border)'">
            <span class="absolute top-0.5 w-5 h-5 rounded-full shadow-sm transition-all duration-200"
              style="background:#fff"
              :style="locationForm.is_active ? 'left:18px' : 'left:2px'"></span>
          </button>
          <div>
            <p class="text-xs font-semibold" style="color:var(--tx-primary)">Activează monitorizare imediat</p>
            <p class="text-[11px]" style="color:var(--tx-muted)">Sistemul va prelucra streamul RTSP în timp real</p>
          </div>
        </div>

        <!-- Butoane -->
        <div class="flex gap-3 pt-1">
          <button type="button" @click="locationModalOpen=false"
            class="flex-1 py-2.5 rounded-xl text-sm font-semibold transition-all"
            style="background:var(--bg-raised);border:1px solid var(--bg-border);color:var(--tx-secondary)"
            @mouseenter="$el.style.borderColor='var(--tx-muted)'"
            @mouseleave="$el.style.borderColor='var(--bg-border)'">
            Anulează
          </button>
          <button type="submit"
            class="flex-1 flex items-center justify-center gap-2 py-2.5 rounded-xl text-sm font-bold transition-all"
            style="background:var(--eco-green-dark);color:#fff;box-shadow:0 4px 14px rgba(5,150,105,.3)"
            @mouseenter="$el.style.opacity='.9'"
            @mouseleave="$el.style.opacity='1'">
            <i data-lucide="save" class="w-4 h-4"></i>
            <span x-text="locationEdit ? 'Salvează' : 'Adaugă'"></span>
          </button>
        </div>
      </form>
    </div>
  </div>

</div>
