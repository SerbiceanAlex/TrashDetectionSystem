<!-- ══ RAPOARTE ════════════════════════════════════════════════════════════ -->
<div x-show="activeTab === 'reports'" x-cloak
  x-transition:enter="transition ease-out duration-200"
  x-transition:enter-start="opacity-0 translate-y-1"
  x-transition:enter-end="opacity-100 translate-y-0"
  x-init="if(activeTab==='reports') loadReportStats()"
  class="space-y-4">

  <!-- ── Hero ──────────────────────────────────────────────────────────── -->
  <div class="rounded-2xl p-5 flex items-center gap-4 flex-wrap"
       style="background:linear-gradient(135deg,#1e1b4b 0%,#312e81 55%,#4338ca 100%);box-shadow:0 4px 24px rgba(99,102,241,.25)">
    <div class="w-11 h-11 rounded-xl flex items-center justify-center shrink-0"
         style="background:rgba(255,255,255,.12)">
      <i data-lucide="bar-chart-2" class="w-5 h-5" style="color:#fff"></i>
    </div>
    <div class="flex-1 min-w-0">
      <p class="text-base font-bold" style="color:#fff">Rapoarte și export</p>
      <p class="text-sm mt-0.5" style="color:rgba(255,255,255,.65)">Generează rapoarte PDF/CSV pentru management, audit sau autoritate</p>
    </div>
    <div class="flex items-center gap-2 px-3 py-1.5 rounded-full text-xs font-bold"
         style="background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.85)">
      <i data-lucide="clock" class="w-3.5 h-3.5"></i>
      <span x-text="reportPeriod==='today'?'Azi':reportPeriod==='week'?'7 zile':reportPeriod==='month'?'30 zile':reportPeriod==='year'?'1 an':'Personalizat'"></span>
    </div>
  </div>

  <!-- ── Selector perioadă ─────────────────────────────────────────────── -->
  <div class="rounded-2xl p-4 space-y-3" style="background:var(--bg-surface);border:1px solid var(--bg-border)">
    <p class="text-[10px] font-bold uppercase tracking-widest" style="color:var(--tx-muted)">Interval de raportare</p>

    <!-- Chip-uri perioadă -->
    <div class="flex gap-2 flex-wrap">
      <template x-for="p in [
        {v:'today', l:'Azi'},
        {v:'week', l:'7 zile'},
        {v:'month', l:'30 zile'},
        {v:'year', l:'1 an'},
        {v:'custom', l:'Personalizat'}
      ]" :key="p.v">
        <button @click="reportPeriod=p.v; if(p.v!=='custom') loadReportStats()"
          class="px-4 py-1.5 rounded-full text-xs font-semibold transition-all duration-150"
          :style="reportPeriod===p.v
            ? 'background:#4f46e5;color:#fff;box-shadow:0 2px 8px rgba(79,70,229,.35)'
            : 'background:var(--bg-raised);color:var(--tx-secondary);border:1px solid var(--bg-border)'"
          x-text="p.l">
        </button>
      </template>
    </div>

    <!-- Range personalizat -->
    <div x-show="reportPeriod==='custom'" class="flex gap-3 flex-wrap items-end pt-1">
      <div>
        <label class="block text-[11px] font-semibold mb-1.5" style="color:var(--tx-muted)">De la</label>
        <input type="date" x-model="reportFrom"
          class="px-3 py-2 rounded-xl text-xs transition-all outline-none"
          style="border:1px solid var(--bg-border);background:var(--bg-raised);color:var(--tx-primary)"
          @focus="$el.style.borderColor='#6366f1'"
          @blur="$el.style.borderColor='var(--bg-border)'"/>
      </div>
      <div>
        <label class="block text-[11px] font-semibold mb-1.5" style="color:var(--tx-muted)">Până la</label>
        <input type="date" x-model="reportTo"
          class="px-3 py-2 rounded-xl text-xs transition-all outline-none"
          style="border:1px solid var(--bg-border);background:var(--bg-raised);color:var(--tx-primary)"
          @focus="$el.style.borderColor='#6366f1'"
          @blur="$el.style.borderColor='var(--bg-border)'"/>
      </div>
      <button @click="loadReportStats()"
        class="flex items-center gap-2 px-4 py-2 rounded-xl text-xs font-semibold"
        style="background:#4f46e5;color:#fff;box-shadow:0 2px 8px rgba(79,70,229,.3)">
        <i data-lucide="search" class="w-3.5 h-3.5"></i> Aplică
      </button>
    </div>
  </div>

  <!-- ── KPI 4 carduri ─────────────────────────────────────────────────── -->
  <template x-if="reportStats">
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">

      <div class="p-4 rounded-xl transition-all duration-200"
           style="background:var(--bg-surface);border:1px solid var(--bg-border)"
           @mouseenter="$el.style.boxShadow='0 0 0 2px rgba(99,102,241,.35)';$el.style.transform='translateY(-1px)'"
           @mouseleave="$el.style.boxShadow='';$el.style.transform=''">
        <p class="text-[10px] font-bold uppercase tracking-widest mb-2 flex items-center gap-1" style="color:var(--tx-muted)">
          <i data-lucide="alert-triangle" class="w-3 h-3" style="color:#ef4444"></i> Incidente
        </p>
        <p class="text-3xl font-extrabold leading-none" style="color:var(--tx-primary)"
           x-text="reportStats?.total_incidents ?? '—'"></p>
        <p class="text-[10px] mt-1.5" style="color:var(--tx-muted)">în perioadă</p>
      </div>

      <div class="p-4 rounded-xl transition-all duration-200"
           :style="darkMode ? 'background:#292524;border:1px solid #57534e' : 'background:#fffbeb;border:1px solid #fde68a'"
           @mouseenter="$el.style.boxShadow='0 0 0 2px rgba(245,158,11,.4)';$el.style.transform='translateY(-1px)'"
           @mouseleave="$el.style.boxShadow='';$el.style.transform=''">
        <p class="text-[10px] font-bold uppercase tracking-widest mb-2 flex items-center gap-1"
           :style="darkMode ? 'color:#fbbf24' : 'color:#d97706'">
          <i data-lucide="clock" class="w-3 h-3"></i> Așteptare
        </p>
        <p class="text-3xl font-extrabold leading-none"
           :style="darkMode ? 'color:#fbbf24' : 'color:#f59e0b'"
           x-text="reportStats?.pending ?? 0"></p>
        <p class="text-[10px] mt-1.5" :style="darkMode ? 'color:#fbbf24;opacity:.7' : 'color:#d97706;opacity:.7'">nerevizuite</p>
      </div>

      <div class="p-4 rounded-xl transition-all duration-200"
           :style="darkMode ? 'background:#1e3a5f;border:1px solid #1d4ed8' : 'background:#eff6ff;border:1px solid #bfdbfe'"
           @mouseenter="$el.style.boxShadow='0 0 0 2px rgba(59,130,246,.4)';$el.style.transform='translateY(-1px)'"
           @mouseleave="$el.style.boxShadow='';$el.style.transform=''">
        <p class="text-[10px] font-bold uppercase tracking-widest mb-2 flex items-center gap-1"
           :style="darkMode ? 'color:#60a5fa' : 'color:#2563eb'">
          <i data-lucide="send" class="w-3 h-3"></i> Trimise
        </p>
        <p class="text-3xl font-extrabold leading-none"
           :style="darkMode ? 'color:#60a5fa' : 'color:#3b82f6'"
           x-text="reportStats?.forwarded ?? 0"></p>
        <p class="text-[10px] mt-1.5" :style="darkMode ? 'color:#60a5fa;opacity:.7' : 'color:#2563eb;opacity:.7'">autoritate</p>
      </div>

      <div class="p-4 rounded-xl transition-all duration-200"
           :style="darkMode ? 'background:#064e3b;border:1px solid #065f46' : 'background:#ecfdf5;border:1px solid #a7f3d0'"
           @mouseenter="$el.style.boxShadow='0 0 0 2px rgba(16,185,129,.4)';$el.style.transform='translateY(-1px)'"
           @mouseleave="$el.style.boxShadow='';$el.style.transform=''">
        <p class="text-[10px] font-bold uppercase tracking-widest mb-2 flex items-center gap-1" style="color:#059669">
          <i data-lucide="map-pin" class="w-3 h-3"></i> Locații
        </p>
        <p class="text-3xl font-extrabold leading-none"
           :style="darkMode ? 'color:#34d399' : 'color:#059669'"
           x-text="reportStats?.locations_active ?? 0"></p>
        <p class="text-[10px] mt-1.5" :style="darkMode ? 'color:#34d399;opacity:.7' : 'color:#059669;opacity:.7'">active</p>
      </div>
    </div>
  </template>

  <!-- Skeleton KPI -->
  <template x-if="!reportStats">
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
      <template x-for="i in [1,2,3,4]" :key="i">
        <div class="p-4 rounded-xl animate-pulse" style="background:var(--bg-surface);border:1px solid var(--bg-border)">
          <div class="h-3 rounded mb-3" style="background:var(--bg-border);width:60%"></div>
          <div class="h-8 rounded mb-2" style="background:var(--bg-border);width:40%"></div>
          <div class="h-2 rounded" style="background:var(--bg-border);width:50%"></div>
        </div>
      </template>
    </div>
  </template>

  <!-- ── Heatmap ore ────────────────────────────────────────────────────── -->
  <template x-if="reportStats?.hourly_distribution && reportStats.hourly_distribution.some(c=>c>0)">
    <div class="rounded-2xl p-5" style="background:var(--bg-surface);border:1px solid var(--bg-border)">
      <div class="flex items-center gap-2 mb-4">
        <i data-lucide="clock" class="w-4 h-4" style="color:#6366f1"></i>
        <p class="text-sm font-bold" style="color:var(--tx-primary)">Distribuție orară</p>
        <span class="text-xs" style="color:var(--tx-muted)">— când se produc incidentele</span>
      </div>
      <div style="display:grid;grid-template-columns:repeat(24,1fr);gap:3px;align-items:end">
        <template x-for="(count, h) in reportStats.hourly_distribution" :key="h">
          <div class="flex flex-col items-center gap-1"
               :title="h+':00 — '+count+' incident'+(count===1?'':'e')">
            <div class="w-full rounded-t-sm min-h-[3px] transition-all duration-300"
              x-effect="
                const mx=Math.max(1,...reportStats.hourly_distribution);
                $el.style.height=(count>0?Math.max(4,Math.round(count/mx*60)):3)+'px';
                $el.style.background=count>0?'linear-gradient(180deg,#818cf8,#4f46e5)':'var(--bg-border)';
              ">
            </div>
            <span class="text-[8px]" style="color:var(--tx-muted)" x-text="h%6===0?h+'h':''"></span>
          </div>
        </template>
      </div>
      <!-- Peak hour -->
      <div class="mt-3 flex items-center gap-2 text-xs px-3 py-2 rounded-xl"
           style="background:rgba(99,102,241,.07);border:1px solid rgba(99,102,241,.15);color:var(--tx-secondary)">
        <i data-lucide="trending-up" class="w-3.5 h-3.5 shrink-0" style="color:#818cf8"></i>
        <span>Oră de vârf: <strong style="color:#818cf8"
          x-text="(function(){ const mx=Math.max(...reportStats.hourly_distribution); const h=reportStats.hourly_distribution.indexOf(mx); return h+':00 – '+(h+1)+':00 ('+mx+' incidente)'; })()">
        </strong></span>
      </div>
    </div>
  </template>

  <!-- ── Top locații ────────────────────────────────────────────────────── -->
  <template x-if="reportStats?.top_locations?.length > 0">
    <div class="rounded-2xl p-5" style="background:var(--bg-surface);border:1px solid var(--bg-border)">
      <div class="flex items-center gap-2 mb-4">
        <i data-lucide="map-pin" class="w-4 h-4" style="color:#ef4444"></i>
        <p class="text-sm font-bold" style="color:var(--tx-primary)">Top locații</p>
        <span class="text-xs" style="color:var(--tx-muted)">— cele mai multe incidente</span>
      </div>
      <div class="space-y-2">
        <template x-for="(loc, idx) in reportStats.top_locations" :key="loc.id">
          <div class="flex items-center gap-3 p-3 rounded-xl transition-all"
               style="background:var(--bg-raised);border:1px solid var(--bg-border)"
               @mouseenter="$el.style.borderColor='rgba(99,102,241,.3)'"
               @mouseleave="$el.style.borderColor='var(--bg-border)'">
            <!-- Rank badge -->
            <div class="w-8 h-8 rounded-xl flex items-center justify-center text-xs font-black shrink-0"
                 :style="idx===0 ? ('background:rgba(245,158,11,.2);color:'+(darkMode?'#fbbf24':'#d97706')) : idx===1 ? ('background:rgba(156,163,175,.15);color:'+(darkMode?'#9ca3af':'#64748b')) : idx===2 ? 'background:rgba(180,83,9,.15);color:#d97706' : 'background:var(--bg-border);color:var(--tx-muted)'"
                 x-text="idx+1"></div>
            <div class="flex-1 min-w-0">
              <p class="text-sm font-semibold truncate" style="color:var(--tx-primary)" x-text="loc.name"></p>
              <p class="text-[11px] truncate" style="color:var(--tx-muted)" x-text="loc.address || ''"></p>
            </div>
            <div class="text-right shrink-0">
              <p class="text-base font-extrabold" style="color:var(--tx-primary)" x-text="loc.count"></p>
              <p class="text-[10px]" style="color:var(--tx-muted)">incidente</p>
            </div>
          </div>
        </template>
      </div>
    </div>
  </template>

  <!-- ── Distribuție material ───────────────────────────────────────────── -->
  <template x-if="reportStats?.material_distribution?.filter(m=>m.material&&m.material!=='unknown').length > 0">
    <div class="rounded-2xl p-5" style="background:var(--bg-surface);border:1px solid var(--bg-border)">
      <div class="flex items-center justify-between mb-4">
        <div class="flex items-center gap-2">
          <i data-lucide="layers" class="w-4 h-4" style="color:var(--eco-green-dark)"></i>
          <p class="text-sm font-bold" style="color:var(--tx-primary)">Materiale identificate</p>
        </div>
        <span class="text-xs" style="color:var(--tx-muted)"
          x-text="reportStats.material_distribution.reduce((s,m)=>s+m.count,0)+' total'"></span>
      </div>
      <div class="space-y-3">
        <template x-for="m in reportStats.material_distribution.filter(m=>m.material&&m.material!=='unknown')" :key="m.material">
          <div>
            <div class="flex items-center justify-between mb-1.5">
              <div class="flex items-center gap-2">
                <span class="w-2 h-2 rounded-full shrink-0"
                  :style="m.material==='plastic'?'background:#60a5fa':m.material==='paper'?'background:#fbbf24':m.material==='glass'?'background:#22d3ee':m.material==='metal'?'background:#a78bfa':'background:#94a3b8'">
                </span>
                <span class="text-sm font-semibold"
                  :style="m.material==='plastic'?'color:'+(darkMode?'#60a5fa':'#2563eb'):m.material==='paper'?'color:'+(darkMode?'#fbbf24':'#d97706'):m.material==='glass'?'color:'+(darkMode?'#22d3ee':'#0891b2'):m.material==='metal'?'color:'+(darkMode?'#a78bfa':'#7c3aed'):'color:var(--tx-secondary)'"
                  x-text="m.material==='paper'?'Hârtie':m.material==='glass'?'Sticlă':m.material==='plastic'?'Plastic':m.material==='metal'?'Metal':m.material==='other'?'Altele':m.material">
                </span>
              </div>
              <div class="flex items-center gap-2 text-xs">
                <span style="color:var(--tx-muted)"
                  x-text="(m.count/Math.max(1,reportStats.material_distribution.reduce((s,i)=>s+i.count,0))*100).toFixed(0)+'%'">
                </span>
                <span class="font-bold" style="color:var(--tx-primary)" x-text="m.count"></span>
              </div>
            </div>
            <div class="h-2 rounded-full overflow-hidden" style="background:var(--bg-raised)">
              <div class="h-full rounded-full transition-all duration-700"
                x-effect="
                  const t=reportStats.material_distribution.reduce((s,i)=>s+i.count,0);
                  $el.style.width=(t>0?(m.count/t*100).toFixed(1):0)+'%';
                  $el.style.background=m.material==='plastic'?'#3b82f6':m.material==='paper'?'#f59e0b':m.material==='glass'?'#06b6d4':m.material==='metal'?'#8b5cf6':'#94a3b8';
                ">
              </div>
            </div>
          </div>
        </template>
      </div>
    </div>
  </template>

  <!-- ── Export ─────────────────────────────────────────────────────────── -->
  <div class="rounded-2xl p-5" style="background:var(--bg-surface);border:1px solid var(--bg-border)">
    <div class="flex items-center gap-2 mb-2">
      <i data-lucide="download" class="w-4 h-4" style="color:#6366f1"></i>
      <p class="text-sm font-bold" style="color:var(--tx-primary)">Export raport</p>
    </div>
    <p class="text-xs mb-4" style="color:var(--tx-muted)">
      Raport oficial cu evidență completă pentru management, audit sau autoritate.
    </p>
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">

      <!-- PDF — Pro+ only -->
      <button @click="planFeatures.exportPDF ? window.print() : goTo('plans')"
        class="flex items-center justify-center gap-2 py-3 rounded-xl text-sm font-bold transition-all relative"
        :style="planFeatures.exportPDF
          ? 'background:linear-gradient(135deg,#4f46e5,#6366f1);color:#fff;box-shadow:0 4px 14px rgba(79,70,229,.3)'
          : 'background:var(--bg-raised);border:1.5px solid rgba(99,102,241,.3);color:#818cf8;cursor:pointer'"
        @mouseenter="$el.style.opacity='.9'" @mouseleave="$el.style.opacity='1'">
        <i :data-lucide="planFeatures.exportPDF ? 'printer' : 'lock'" class="w-4 h-4"></i>
        <span x-text="planFeatures.exportPDF ? 'Printează / PDF' : 'PDF — Plan Pro'"></span>
      </button>

      <!-- CSV — toate planurile -->
      <button @click="exportReport('csv')"
        class="flex items-center justify-center gap-2 py-3 rounded-xl text-sm font-semibold transition-all"
        style="background:var(--bg-raised);border:1px solid var(--bg-border);color:var(--tx-primary)"
        @mouseenter="$el.style.borderColor='#6366f1';$el.style.color='#818cf8'"
        @mouseleave="$el.style.borderColor='var(--bg-border)';$el.style.color='var(--tx-primary)'">
        <i data-lucide="table-2" class="w-4 h-4"></i> Export CSV
      </button>

      <!-- ZIP — Pro+ only -->
      <button @click="planFeatures.exportZIP ? showToast('ZIP disponibil în curând', 'info') : goTo('plans')"
        class="flex items-center justify-center gap-2 py-3 rounded-xl text-sm font-semibold transition-all"
        :style="planFeatures.exportZIP
          ? 'background:var(--bg-raised);border:1px solid var(--bg-border);color:var(--tx-primary)'
          : 'background:var(--bg-raised);border:1.5px solid rgba(99,102,241,.3);color:#818cf8;cursor:pointer'">
        <i :data-lucide="planFeatures.exportZIP ? 'archive' : 'lock'" class="w-4 h-4"></i>
        <span x-text="planFeatures.exportZIP ? 'ZIP clipuri' : 'ZIP — Plan Pro'"></span>
      </button>
    </div>
  </div>

</div>
