<!-- ══ DASHBOARD ══════════════════════════════════════════════════════════ -->
<div x-show="activeTab === 'dashboard'" x-cloak class="animate-fade-up space-y-4">

  <!-- Hero banner — ADMIN -->
  <div x-show="isAdmin" class="rounded-2xl p-5 flex items-center gap-4 flex-wrap"
       style="background:linear-gradient(135deg,#064e3b 0%,#065f46 55%,#047857 100%);box-shadow:0 8px 32px rgba(5,150,105,.25)">
    <div class="w-11 h-11 rounded-xl flex items-center justify-center shrink-0"
         style="background:rgba(255,255,255,.15)">
      <i data-lucide="shield-check" class="w-5 h-5" style="color:#fff"></i>
    </div>
    <div class="flex-1 min-w-0">
      <p class="text-base font-bold" style="color:#fff">
        Bună, <span x-text="user?.username ?? ''"></span>
        <span class="text-xs font-normal ml-2 px-2 py-0.5 rounded-full" style="background:rgba(255,255,255,.2);color:#fff">ADMIN</span>
      </p>
      <p class="text-sm mt-0.5" style="color:rgba(167,243,208,.85)">
        <span x-text="org?.name ?? 'Organizație'"></span> · Plan
        <strong x-text="(org?.plan||'trial').toUpperCase()" style="color:#fff"></strong>
        <template x-if="org?.plan === 'trial'">
          <span x-text="` · Trial: ${org.trial_days_left ?? 0} zile`"></span>
        </template>
      </p>
    </div>
    <div class="flex gap-2 flex-wrap">
      <button @click="goTo('scan')"
        class="flex items-center gap-2 px-4 py-2 rounded-xl text-sm font-semibold whitespace-nowrap"
        style="background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff"
        @mouseenter="$el.style.background='rgba(255,255,255,.25)'"
        @mouseleave="$el.style.background='rgba(255,255,255,.15)'">
        <i data-lucide="play-circle" class="w-4 h-4"></i> Monitor
      </button>
      <button @click="goTo('admin')"
        class="flex items-center gap-2 px-4 py-2 rounded-xl text-sm font-semibold whitespace-nowrap"
        style="background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.8)"
        @mouseenter="$el.style.background='rgba(255,255,255,.2)'"
        @mouseleave="$el.style.background='rgba(255,255,255,.1)'">
        <i data-lucide="users" class="w-4 h-4"></i> Admin
      </button>
    </div>
  </div>

  <!-- Hero banner — USER (operator) -->
  <div x-show="!isAdmin" class="rounded-2xl p-5 flex items-center gap-4 flex-wrap"
       style="background:linear-gradient(135deg,#1e3a5f 0%,#1d4ed8 55%,#2563eb 100%);box-shadow:0 8px 32px rgba(37,99,235,.25)">
    <div class="w-11 h-11 rounded-xl flex items-center justify-center shrink-0"
         style="background:rgba(255,255,255,.15)">
      <i data-lucide="eye" class="w-5 h-5" style="color:#fff"></i>
    </div>
    <div class="flex-1 min-w-0">
      <p class="text-base font-bold" style="color:#fff">
        Bună, <span x-text="user?.username ?? ''"></span>
        <span class="text-xs font-normal ml-2 px-2 py-0.5 rounded-full" style="background:rgba(255,255,255,.2);color:#fff">OPERATOR</span>
      </p>
      <p class="text-sm mt-0.5" style="color:rgba(191,219,254,.85)">
        <span x-text="org?.name ?? 'Organizație'"></span> · Panou monitorizare
      </p>
    </div>
    <button @click="goTo('incidents')"
      class="flex items-center gap-2 px-4 py-2 rounded-xl text-sm font-semibold whitespace-nowrap"
      style="background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff"
      @mouseenter="$el.style.background='rgba(255,255,255,.25)'"
      @mouseleave="$el.style.background='rgba(255,255,255,.15)'">
      <i data-lucide="alert-triangle" class="w-4 h-4"></i>
      Incidente
      <span x-show="(dashB2B?.pending_review??0) > 0" class="w-5 h-5 rounded-full text-[10px] font-bold flex items-center justify-center"
        style="background:#ef4444;color:#fff" x-text="dashB2B?.pending_review"></span>
    </button>
  </div>

  <!-- KPI grid: 2 cols mobile, 3 cols tablet+ -->
  <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">

    <!-- Azi -->
    <div @click="goTo('incidents')"
      class="p-4 rounded-xl cursor-pointer transition-all duration-200"
      style="background:var(--bg-surface);border:1px solid var(--bg-border)"
      @mouseenter="$el.style.boxShadow='0 0 0 2px rgba(16,185,129,.45)';$el.style.transform='translateY(-1px)'"
      @mouseleave="$el.style.boxShadow='';$el.style.transform=''">
      <p class="text-[10px] font-bold uppercase tracking-widest mb-2" style="color:var(--tx-muted)">Azi</p>
      <p class="text-3xl font-extrabold leading-none" style="color:var(--tx-primary)"
         x-text="dashB2B?.incidents_today ?? '—'"></p>
      <p class="text-[10px] mt-1.5" style="color:var(--tx-muted)">incidente</p>
    </div>

    <!-- 7 zile -->
    <div @click="goTo('incidents')"
      class="p-4 rounded-xl cursor-pointer transition-all duration-200"
      style="background:var(--bg-surface);border:1px solid var(--bg-border)"
      @mouseenter="$el.style.boxShadow='0 0 0 2px rgba(16,185,129,.45)';$el.style.transform='translateY(-1px)'"
      @mouseleave="$el.style.boxShadow='';$el.style.transform=''">
      <p class="text-[10px] font-bold uppercase tracking-widest mb-2" style="color:var(--tx-muted)">7 zile</p>
      <p class="text-3xl font-extrabold leading-none" style="color:var(--tx-primary)"
         x-text="dashB2B?.incidents_week ?? '—'"></p>
      <p class="text-[10px] mt-1.5" style="color:var(--tx-muted)">incidente</p>
    </div>

    <!-- Rezolvate -->
    <div class="p-4 rounded-xl transition-all duration-200"
         :style="darkMode ? 'background:#064e3b;border:1px solid #065f46' : 'background:#ecfdf5;border:1px solid #a7f3d0'"
         @mouseenter="$el.style.boxShadow='0 0 0 2px rgba(16,185,129,.45)';$el.style.transform='translateY(-1px)'"
         @mouseleave="$el.style.boxShadow='';$el.style.transform=''">
      <p class="text-[10px] font-bold uppercase tracking-widest mb-2" style="color:#059669">Rezolvate</p>
      <p class="text-3xl font-extrabold leading-none"
         :style="darkMode ? 'color:#34d399' : 'color:#059669'"
         x-text="(dashB2B?.resolution_rate ?? 0) + '%'"></p>
      <p class="text-[10px] mt-1.5" :style="darkMode ? 'color:#34d399;opacity:.7' : 'color:#059669;opacity:.7'">din total</p>
    </div>

    <!-- Așteptare — admin only -->
    <div x-show="isAdmin" @click="incidentStatusFilter='pending'; goTo('incidents')"
      class="p-4 rounded-xl cursor-pointer transition-all duration-200"
      :style="darkMode ? 'background:#292524;border:1px solid #57534e' : 'background:#fffbeb;border:1px solid #fde68a'"
      @mouseenter="$el.style.boxShadow='0 0 0 2px rgba(245,158,11,.5)';$el.style.transform='translateY(-1px)'"
      @mouseleave="$el.style.boxShadow='';$el.style.transform=''">
      <p class="text-[10px] font-bold uppercase tracking-widest mb-2"
         :style="darkMode ? 'color:#fbbf24' : 'color:#d97706'">Așteptare</p>
      <p class="text-3xl font-extrabold leading-none"
         :style="darkMode ? 'color:#fbbf24' : 'color:#f59e0b'"
         x-text="dashB2B?.pending_review ?? 0"></p>
      <p class="text-[10px] mt-1.5"
         :style="darkMode ? 'color:#fbbf24;opacity:.7' : 'color:#d97706;opacity:.7'">de revizuit</p>
    </div>

    <!-- Trimise — admin only -->
    <div x-show="isAdmin" @click="incidentStatusFilter='forwarded'; goTo('incidents')"
      class="p-4 rounded-xl cursor-pointer transition-all duration-200"
      :style="darkMode ? 'background:#1e3a5f;border:1px solid #1d4ed8' : 'background:#eff6ff;border:1px solid #bfdbfe'"
      @mouseenter="$el.style.boxShadow='0 0 0 2px rgba(59,130,246,.5)';$el.style.transform='translateY(-1px)'"
      @mouseleave="$el.style.boxShadow='';$el.style.transform=''">
      <p class="text-[10px] font-bold uppercase tracking-widest mb-2"
         :style="darkMode ? 'color:#60a5fa' : 'color:#2563eb'">Trimise</p>
      <p class="text-3xl font-extrabold leading-none"
         :style="darkMode ? 'color:#60a5fa' : 'color:#3b82f6'"
         x-text="dashB2B?.forwarded ?? 0"></p>
      <p class="text-[10px] mt-1.5"
         :style="darkMode ? 'color:#60a5fa;opacity:.7' : 'color:#2563eb;opacity:.7'">la autoritate</p>
    </div>

    <!-- User: Incidente de revizuit (work queue) -->
    <div x-show="!isAdmin" @click="incidentStatusFilter='pending'; goTo('incidents')"
      class="p-4 rounded-xl cursor-pointer transition-all duration-200 col-span-2"
      :style="(dashB2B?.pending_review??0) > 0
        ? (darkMode ? 'background:#292524;border:1px solid #f59e0b' : 'background:#fffbeb;border:1px solid #f59e0b')
        : 'background:var(--bg-surface);border:1px solid var(--bg-border)'"
      @mouseenter="$el.style.transform='translateY(-1px)'"
      @mouseleave="$el.style.transform=''">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl flex items-center justify-center"
          :style="(dashB2B?.pending_review??0) > 0 ? 'background:rgba(245,158,11,.15)' : 'background:var(--bg-raised)'">
          <i data-lucide="inbox" class="w-5 h-5"
            :style="(dashB2B?.pending_review??0) > 0 ? 'color:#f59e0b' : 'color:var(--tx-muted)'"></i>
        </div>
        <div>
          <p class="text-sm font-bold" style="color:var(--tx-primary)">
            <span x-text="(dashB2B?.pending_review??0) > 0 ? `${dashB2B.pending_review} incidente` : 'Nicio acțiune necesară'"></span>
          </p>
          <p class="text-[11px]" style="color:var(--tx-muted)">
            <span x-text="(dashB2B?.pending_review??0) > 0 ? 'de revizuit în coada de lucru' : 'toate incidentele sunt procesate'"></span>
          </p>
        </div>
        <i x-show="(dashB2B?.pending_review??0) > 0" data-lucide="chevron-right" class="w-4 h-4 ml-auto" style="color:var(--tx-muted)"></i>
      </div>
    </div>

    <!-- Total -->
    <div class="p-4 rounded-xl transition-all duration-200"
         style="background:var(--bg-surface);border:1px solid var(--bg-border)"
         @mouseenter="$el.style.boxShadow='0 0 0 2px rgba(16,185,129,.35)';$el.style.transform='translateY(-1px)'"
         @mouseleave="$el.style.boxShadow='';$el.style.transform=''">
      <p class="text-[10px] font-bold uppercase tracking-widest mb-2" style="color:var(--tx-muted)">Total</p>
      <p class="text-3xl font-extrabold leading-none" style="color:var(--tx-primary)"
         x-text="dashB2B?.total_all_time ?? 0"></p>
      <p class="text-[10px] mt-1.5" style="color:var(--tx-muted)">all time</p>
    </div>
  </div>

  <!-- Grafic activitate -->
  <div class="rounded-2xl p-5 shadow-sm"
       style="background:var(--bg-surface);border:1px solid var(--bg-border)"
       x-data="{ chartPeriod: '30d' }">

    <!-- Header -->
    <div class="flex items-center justify-between flex-wrap gap-3 mb-4">
      <div class="flex items-center gap-2 text-sm font-bold" style="color:var(--tx-primary)">
        <i data-lucide="bar-chart-3" class="w-4 h-4" style="color:var(--eco-green-dark)"></i>
        Activitate
      </div>

      <!-- Segmented control -->
      <div class="flex rounded-lg overflow-hidden"
           style="border:1px solid var(--bg-border);background:var(--bg-raised)">
        <template x-for="opt in [{v:'1d',l:'Azi'},{v:'7d',l:'7 zile'},{v:'30d',l:'30 zile'}]" :key="opt.v">
          <button
            @click="chartPeriod = opt.v"
            x-text="opt.l"
            class="px-3.5 py-1.5 text-xs font-semibold transition-all duration-150 whitespace-nowrap"
            :style="chartPeriod === opt.v
              ? 'background:#059669;color:#fff;box-shadow:none'
              : 'background:transparent;color:var(--tx-secondary);border-right:1px solid var(--bg-border)'">
          </button>
        </template>
      </div>
    </div>

    <!-- Chart -->
    <template x-if="dashB2B?.trend_30d">
      <div x-data="{
        get rows() {
          const all = dashB2B?.trend_30d || [];
          if (chartPeriod === '1d') return all.slice(-1);
          if (chartPeriod === '7d') return all.slice(-7);
          return all;
        },
        hov: null
      }">
        <!-- Period + total -->
        <div class="flex items-center justify-between mb-3">
          <span class="text-xs" style="color:var(--tx-muted)"
            x-text="chartPeriod==='1d' ? 'astăzi' : chartPeriod==='7d' ? 'ultimele 7 zile' : 'ultimele 30 zile'"></span>
          <span class="text-xs font-bold" style="color:#059669"
            x-text="rows.reduce((s,p)=>s+p.count,0) + ' incidente'"></span>
        </div>

        <!-- Tooltip -->
        <div class="h-6 flex items-center justify-center mb-1">
          <span class="text-xs font-semibold px-3 py-0.5 rounded-full transition-all duration-150"
            style="background:rgba(5,150,105,.12);color:#059669"
            :style="hov ? 'opacity:1' : 'opacity:0'"
            x-text="hov ? hov.date + ' — ' + hov.count + (hov.count===1?' incident':' incidente') : ' '">
          </span>
        </div>

        <!-- Bare -->
        <div class="flex items-end gap-px h-24">
          <template x-for="p in rows" :key="p.day">
            <div class="flex-1 flex items-end justify-center h-full relative cursor-pointer group"
              @mouseenter="hov = {
                date: new Date(p.day+'T12:00:00').toLocaleDateString('ro-RO',{day:'2-digit',month:'short'}),
                count: p.count
              }"
              @mouseleave="hov = null">
              <!-- Today label — hidden when tooltip is active to avoid overlap -->
              <template x-if="p.day === new Date().toISOString().slice(0,10) && !hov">
                <span class="absolute -top-4 left-1/2 -translate-x-1/2 text-[8px] font-bold"
                      style="color:var(--eco-green-dark)">azi</span>
              </template>
              <!-- Bar -->
              <div class="w-full min-h-[3px] rounded-t-sm transition-all duration-300"
                x-effect="
                  const mx = Math.max(1, ...rows.map(x=>x.count));
                  const h = p.count > 0 ? Math.max(6, Math.round(p.count/mx*88)) : 3;
                  $el.style.height = h + 'px';
                  const isToday = p.day === new Date().toISOString().slice(0,10);
                  const isHov = hov && hov.date === new Date(p.day+'T12:00:00').toLocaleDateString('ro-RO',{day:'2-digit',month:'short'});
                  if (p.count === 0) {
                    $el.style.background = document.documentElement.classList.contains('dark') ? 'rgba(51,65,85,0.5)' : 'rgba(226,232,240,0.6)';
                  } else if (isToday) {
                    $el.style.background = 'linear-gradient(180deg,#34d399,#059669)';
                  } else if (isHov) {
                    $el.style.background = 'linear-gradient(180deg,#6ee7b7,#10b981)';
                  } else {
                    $el.style.background = 'linear-gradient(180deg,#10b981,#065f46)';
                  }
                  $el.style.boxShadow = isHov ? '0 0 8px rgba(16,185,129,0.4)' : 'none';
                ">
              </div>
            </div>
          </template>
        </div>

        <!-- X axis -->
        <div class="flex gap-px pt-2 mt-1" style="border-top:1px solid var(--bg-border)">
          <template x-for="p in rows" :key="p.day">
            <div class="flex-1 text-center">
              <span class="text-[9px] leading-tight block"
                :style="p.day===new Date().toISOString().slice(0,10)
                  ? 'color:#059669;font-weight:700'
                  : 'color:var(--tx-muted)'"
                x-text="(function(){
                  const d = new Date(p.day+'T12:00:00');
                  const dn = d.getDate();
                  if (chartPeriod !== '30d') return d.toLocaleDateString('ro-RO',{day:'2-digit',month:'short'});
                  return (dn===1||dn===6||dn===11||dn===16||dn===21||dn===26)
                    ? d.toLocaleDateString('ro-RO',{day:'2-digit',month:'short'}) : '';
                })()">
              </span>
            </div>
          </template>
        </div>
      </div>
    </template>

    <!-- Loading skeleton -->
    <template x-if="!dashB2B?.trend_30d">
      <div class="h-28 rounded-xl animate-pulse" style="background:var(--bg-raised)"></div>
    </template>
  </div>

  <!-- Ore de vârf -->
  <template x-if="dashB2B?.hourly_distribution && dashB2B.hourly_distribution.some(c=>c>0)">
    <div class="rounded-2xl p-5 shadow-sm"
         style="background:var(--bg-surface);border:1px solid var(--bg-border)">
      <div class="flex items-center gap-2 mb-4">
        <i data-lucide="clock" class="w-4 h-4" style="color:var(--eco-green-dark)"></i>
        <span class="text-sm font-bold" style="color:var(--tx-primary)">Ore de vârf</span>
        <span class="text-xs" style="color:var(--tx-muted)">— când se produc cel mai des incidentele</span>
      </div>

      <div class="grid grid-cols-24 gap-px items-end" style="display:grid;grid-template-columns:repeat(24,1fr);gap:3px;align-items:end">
        <template x-for="(count, h) in dashB2B.hourly_distribution" :key="h">
          <div class="flex flex-col items-center gap-1" :title="h+':00 — '+count+' incident'+(count===1?'':'e')">
            <div class="w-full rounded-t-[2px] min-h-[3px] transition-all duration-300"
              x-effect="
                const mx = Math.max(1,...dashB2B.hourly_distribution);
                $el.style.height = (count>0 ? Math.max(4, Math.round(count/mx*56)) : 3) + 'px';
                $el.style.background = count>0 ? 'linear-gradient(180deg,#10b981,#059669)' : 'var(--bg-border)';
              ">
            </div>
            <span class="text-[8px]" style="color:var(--tx-muted)"
              x-text="h%6===0 ? h+'h' : ''"></span>
          </div>
        </template>
      </div>

      <div class="mt-3 flex items-center gap-2 text-xs rounded-lg px-3 py-2"
           style="background:rgba(16,185,129,.08);border:1px solid rgba(16,185,129,.15);color:var(--tx-secondary)">
        <i data-lucide="trending-up" class="w-3.5 h-3.5 shrink-0" style="color:var(--eco-green-dark)"></i>
        <span>Oră de vârf: <strong style="color:var(--eco-green-dark)"
          x-text="(function(){
            const mx=Math.max(...dashB2B.hourly_distribution);
            const h=dashB2B.hourly_distribution.indexOf(mx);
            return h+':00 – '+(h+1)+':00 ('+mx+' incidente)';
          })()"></strong></span>
      </div>
    </div>
  </template>

  <!-- Incidente recente -->
  <div class="rounded-2xl p-5 shadow-sm"
       style="background:var(--bg-surface);border:1px solid var(--bg-border)">
    <div class="flex items-center justify-between mb-4">
      <div class="flex items-center gap-2 text-sm font-bold" style="color:var(--tx-primary)">
        <i data-lucide="alert-triangle" class="w-4 h-4" style="color:#ef4444"></i>
        Incidente recente
      </div>
      <button @click="goTo('incidents')"
        class="flex items-center gap-1 text-xs font-semibold transition-colors"
        style="color:var(--eco-green-dark)">
        Vezi toate <i data-lucide="arrow-right" class="w-3 h-3"></i>
      </button>
    </div>

    <template x-if="dashB2B?.recent_incidents?.length > 0">
      <div class="space-y-0.5 -mx-2">
        <template x-for="ev in dashB2B.recent_incidents" :key="ev.id">
          <div @click="openIncidentById(ev.id)"
            class="flex items-center gap-3 px-2 py-2.5 rounded-xl cursor-pointer transition-all duration-200"
            onmouseover="this.style.background=document.documentElement.classList.contains('dark')?'rgba(30,41,59,0.8)':'#f1f5f9'"
            onmouseout="this.style.background='transparent'">

            <!-- Thumbnail -->
            <div class="w-12 h-10 rounded-lg overflow-hidden shrink-0"
                 style="border:1px solid var(--bg-border);background:var(--bg-raised)">
              <template x-if="ev.thumbnail_path">
                <img :src="'/littering/'+ev.thumbnail_path"
                     class="w-full h-full object-cover"/>
              </template>
              <template x-if="!ev.thumbnail_path">
                <div class="w-full h-full flex items-center justify-center">
                  <i data-lucide="image-off" class="w-4 h-4" style="color:#94a3b8"></i>
                </div>
              </template>
            </div>

            <!-- Info -->
            <div class="flex-1 min-w-0">
              <div class="flex items-center gap-1.5 flex-wrap">
                <span class="text-[10px] font-bold px-2 py-0.5 rounded-full"
                  :style="ev.status==='pending'
                    ? 'background:rgba(245,158,11,.18);color:'+(darkMode?'#fbbf24':'#d97706')
                    : ev.status==='forwarded'
                    ? 'background:rgba(59,130,246,.18);color:'+(darkMode?'#60a5fa':'#1d4ed8')
                    : ev.status==='reviewed'
                    ? 'background:rgba(16,185,129,.18);color:'+(darkMode?'#10b981':'#047857')
                    : 'background:rgba(107,114,128,.18);color:'+(darkMode?'#9ca3af':'#64748b')"
                  x-text="ev.status==='pending'?'Așteptare':ev.status==='forwarded'?'Trimis':ev.status==='reviewed'?'Verificat':'Respins'">
                </span>
                <span class="text-xs font-semibold capitalize" style="color:var(--tx-primary)"
                  x-text="!ev.material||ev.material==='unknown'?'Necunoscut':ev.material==='paper'?'Hârtie':ev.material==='glass'?'Sticlă':ev.material==='plastic'?'Plastic':ev.material==='metal'?'Metal':ev.material">
                </span>
              </div>
              <p class="text-[10px] mt-0.5" style="color:#94a3b8"
                x-text="ev.det_score>0 ? 'Conf. '+(ev.det_score*100).toFixed(0)+'% · #'+ev.id : '#'+ev.id">
              </p>
            </div>

            <!-- Time + arrow -->
            <div class="flex items-center gap-2 shrink-0">
              <div class="text-right text-[10px] leading-relaxed" style="color:#94a3b8">
                <div x-text="new Date(((ev.detected_at||'').replace(' ','T'))+(ev.detected_at&&!ev.detected_at.endsWith('Z')?'Z':'')).toLocaleTimeString('ro-RO',{hour:'2-digit',minute:'2-digit'})"></div>
                <div x-text="new Date(((ev.detected_at||'').replace(' ','T'))+(ev.detected_at&&!ev.detected_at.endsWith('Z')?'Z':'')).toLocaleDateString('ro-RO',{day:'2-digit',month:'short'})"></div>
              </div>
              <i data-lucide="chevron-right" class="w-3.5 h-3.5 shrink-0" style="color:#cbd5e1"></i>
            </div>
          </div>
        </template>
      </div>
    </template>

    <template x-if="!dashB2B?.recent_incidents || dashB2B.recent_incidents.length === 0">
      <div class="text-center py-8">
        <i data-lucide="shield" class="w-10 h-10 mx-auto mb-3" style="color:var(--bg-border)"></i>
        <p class="text-sm font-semibold" style="color:var(--tx-muted)">Niciun incident detectat</p>
        <button @click="goTo('scan')"
          class="mt-2 text-xs font-semibold hover:underline transition-colors"
          style="color:var(--eco-green-dark)">
          Pornește monitorizarea →
        </button>
      </div>
    </template>
  </div>

  <!-- Materiale -->
  <template x-if="dashB2B?.material_distribution?.filter(m=>m.material&&m.material!=='unknown').length > 0">
    <div class="rounded-2xl p-5 shadow-sm"
         style="background:var(--bg-surface);border:1px solid var(--bg-border)">
      <div class="flex items-center justify-between mb-4">
        <div class="flex items-center gap-2 text-sm font-bold" style="color:var(--tx-primary)">
          <i data-lucide="layers" class="w-4 h-4" style="color:var(--eco-green-dark)"></i>
          Materiale identificate
        </div>
        <span class="text-xs" style="color:var(--tx-muted)"
          x-text="dashB2B.material_distribution.filter(m=>m.material&&m.material!=='unknown').reduce((s,m)=>s+m.count,0)+' total'">
        </span>
      </div>
      <div class="space-y-3">
        <template x-for="m in dashB2B.material_distribution.filter(m=>m.material&&m.material!=='unknown')" :key="m.material">
          <div>
            <div class="flex items-center justify-between mb-1.5">
              <div class="flex items-center gap-2">
                <span class="w-2 h-2 rounded-full shrink-0"
                  :style="m.material==='plastic'?'background:#3b82f6':m.material==='paper'?'background:#f59e0b':m.material==='glass'?'background:#06b6d4':'background:#8b5cf6'">
                </span>
                <span class="text-sm font-semibold"
                  :style="(function(){
                    const dark=darkMode;
                    if(m.material==='plastic') return 'color:'+(dark?'#60a5fa':'#2563eb');
                    if(m.material==='paper')   return 'color:'+(dark?'#fbbf24':'#d97706');
                    if(m.material==='glass')   return 'color:'+(dark?'#22d3ee':'#0891b2');
                    if(m.material==='metal')   return 'color:'+(dark?'#a78bfa':'#7c3aed');
                    return 'color:var(--tx-secondary)';
                  })()"
                  x-text="m.material==='paper'?'Hârtie':m.material==='glass'?'Sticlă':m.material==='plastic'?'Plastic':m.material==='metal'?'Metal':m.material">
                </span>
              </div>
              <div class="flex items-center gap-2 text-xs">
                <span style="color:var(--tx-secondary)"
                  x-text="(function(){const t=dashB2B.material_distribution.filter(m=>m.material&&m.material!=='unknown').reduce((s,i)=>s+i.count,0);return t>0?(m.count/t*100).toFixed(0)+'%':'0%'})()">
                </span>
                <span class="font-bold" style="color:var(--tx-primary)" x-text="m.count"></span>
              </div>
            </div>
            <div class="h-1.5 rounded-full overflow-hidden" style="background:var(--bg-raised)">
              <div class="h-full rounded-full transition-all duration-700"
                x-effect="
                  const t=dashB2B.material_distribution.filter(m=>m.material&&m.material!=='unknown').reduce((s,i)=>s+i.count,0);
                  $el.style.width=(t>0?(m.count/t*100).toFixed(1):0)+'%';
                  $el.style.background=m.material==='plastic'?'#3b82f6':m.material==='paper'?'#f59e0b':m.material==='glass'?'#06b6d4':'#8b5cf6';
                ">
              </div>
            </div>
          </div>
        </template>
      </div>
    </div>
  </template>

  <!-- Actions -->
  <div class="grid grid-cols-2 gap-3 pb-2">
    <button @click="exportIncidentsCSV()"
      class="flex items-center justify-center gap-2 py-3 px-4 rounded-xl text-sm font-semibold transition-all duration-150"
      style="background:var(--bg-surface);border:1px solid var(--bg-border);color:var(--tx-secondary)"
      onmouseover="this.style.borderColor='#059669';this.style.color='#059669'"
      onmouseout="this.style.borderColor='var(--bg-border)';this.style.color='var(--tx-secondary)'">
      <i data-lucide="download" class="w-4 h-4"></i> Export CSV
    </button>
    <button @click="goTo('reports')"
      class="flex items-center justify-center gap-2 py-3 px-4 rounded-xl text-sm font-semibold transition-all duration-150"
      style="background:var(--bg-surface);border:1px solid var(--bg-border);color:var(--tx-secondary)"
      onmouseover="this.style.borderColor='#059669';this.style.color='#059669'"
      onmouseout="this.style.borderColor='var(--bg-border)';this.style.color='var(--tx-secondary)'">
      <i data-lucide="bar-chart-3" class="w-4 h-4"></i> Rapoarte
    </button>
  </div>

</div>
