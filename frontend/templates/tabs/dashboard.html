<!-- ══ Dashboard B2B ══════════════════════════════════════════════════════ -->
<div x-show="activeTab === 'dashboard'" x-cloak
  x-transition:enter="transition ease-out duration-200"
  x-transition:enter-start="opacity-0 translate-y-2"
  x-transition:enter-end="opacity-100 translate-y-0">

  <!-- Welcome header -->
  <div class="card profile-card" style="background:linear-gradient(135deg, var(--eco-green-dark), var(--eco-green));color:white">
    <div style="display:flex;align-items:center;gap:16px">
      <div style="width:56px;height:56px;border-radius:14px;background:rgba(255,255,255,0.18);display:flex;align-items:center;justify-content:center">
        <i data-lucide="shield-check" class="icon icon--lg" style="color:white"></i>
      </div>
      <div style="flex:1">
        <h1 style="font-size:20px;font-weight:700;color:white;margin:0">Bună, <span x-text="user?.username ?? ''"></span></h1>
        <p style="font-size:13px;color:rgba(255,255,255,0.85);margin:2px 0 0">Sistem activ — monitorizare automată deșeuri</p>
      </div>
      <button @click="goTo('scan')" class="btn" style="background:white;color:var(--eco-green-dark);font-weight:700">
        <i data-lucide="video" class="icon icon--sm"></i> Monitor
      </button>
    </div>
  </div>

  <!-- KPI top — incidente -->
  <div class="kpi-grid mb-4">
    <div class="kpi-card">
      <span class="kpi-card__label"><i data-lucide="alert-triangle" class="icon icon--xs"></i> Incidente azi</span>
      <span class="kpi-card__value text-brand" x-text="dashB2B?.incidents_today ?? '—'"></span>
    </div>
    <div class="kpi-card">
      <span class="kpi-card__label"><i data-lucide="calendar" class="icon icon--xs"></i> Săptămâna</span>
      <span class="kpi-card__value text-brand" x-text="dashB2B?.incidents_week ?? '—'"></span>
    </div>
    <div class="kpi-card" style="background:linear-gradient(135deg,rgba(245,158,11,.12),rgba(245,158,11,.04))">
      <span class="kpi-card__label"><i data-lucide="clock" class="icon icon--xs"></i> În așteptare</span>
      <span class="kpi-card__value" style="color:#f59e0b" x-text="dashB2B?.pending_review ?? 0"></span>
    </div>
    <div class="kpi-card" style="background:linear-gradient(135deg,rgba(59,130,246,.12),rgba(59,130,246,.04))">
      <span class="kpi-card__label"><i data-lucide="send" class="icon icon--xs"></i> Trimise autorit.</span>
      <span class="kpi-card__value" style="color:#3b82f6" x-text="dashB2B?.forwarded ?? 0"></span>
    </div>
    <div class="kpi-card" style="background:linear-gradient(135deg,rgba(16,185,129,.12),rgba(16,185,129,.04))">
      <span class="kpi-card__label"><i data-lucide="map-pin" class="icon icon--xs"></i> Locații active</span>
      <span class="kpi-card__value" style="color:#10b981" x-text="dashB2B?.active_locations ?? 0"></span>
    </div>
    <div class="kpi-card" style="background:linear-gradient(135deg,rgba(168,85,247,.12),rgba(168,85,247,.04))">
      <span class="kpi-card__label"><i data-lucide="trending-up" class="icon icon--xs"></i> Total luna</span>
      <span class="kpi-card__value" style="color:#a855f7" x-text="dashB2B?.incidents_month ?? 0"></span>
    </div>
  </div>

  <!-- Trend chart — incidente pe zilele ultimei luni -->
  <div class="card mb-4">
    <div class="flex-between mb-3">
      <h3 class="text-sm font-bold"><i data-lucide="line-chart" class="icon icon--sm"></i> Evoluție incidente — ultimele 30 zile</h3>
      <span class="badge badge--gray" x-text="'total: ' + (dashB2B?.incidents_month || 0)"></span>
    </div>
    <div style="height:180px;position:relative">
      <canvas id="dashB2BTrendChart"></canvas>
    </div>
  </div>

  <!-- Ultimele incidente — recent activity -->
  <div class="card mb-4">
    <div class="flex-between mb-3">
      <h3 class="text-sm font-bold"><i data-lucide="alert-triangle" class="icon icon--sm"></i> Ultimele incidente</h3>
      <button @click="goTo('incidents')" class="btn btn--ghost btn--sm">
        Vezi toate <i data-lucide="arrow-right" class="icon icon--xs"></i>
      </button>
    </div>
    <template x-if="dashB2B?.recent_incidents?.length > 0">
      <div class="flex-col gap-2">
        <template x-for="ev in dashB2B.recent_incidents" :key="ev.id">
          <div @click="goTo('incidents')"
            style="display:flex;align-items:center;gap:12px;padding:10px;border-radius:12px;border:1px solid var(--bg-border);cursor:pointer;transition:background var(--t-fast)"
            onmouseover="this.style.background='var(--bg-raised)'"
            onmouseout="this.style.background='transparent'">
            <img :src="ev.thumbnail_path ? '/littering/' + ev.thumbnail_path : ''" alt=""
              style="width:48px;height:48px;border-radius:8px;object-fit:cover;background:var(--bg-raised)" />
            <div style="flex:1;min-width:0">
              <div style="display:flex;align-items:center;gap:6px">
                <span class="badge"
                  :style="ev.status === 'pending' ? 'background:rgba(245,158,11,.18);color:#f59e0b' : ev.status === 'forwarded' ? 'background:rgba(59,130,246,.18);color:#3b82f6' : ev.status === 'reviewed' ? 'background:rgba(16,185,129,.18);color:#10b981' : 'background:rgba(107,114,128,.18);color:#6b7280'"
                  x-text="ev.status"></span>
                <span style="font-size:12px;font-weight:600;text-transform:capitalize" x-text="ev.material || 'unknown'"></span>
              </div>
              <p style="font-size:11px;color:var(--tx-secondary);margin:2px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"
                x-text="ev.address || (ev.lat ? `${ev.lat.toFixed(4)}, ${ev.lng.toFixed(4)}` : 'fără locație')"></p>
            </div>
            <span style="font-size:10px;color:var(--tx-muted);white-space:nowrap"
              x-text="new Date(ev.detected_at).toLocaleString('ro-RO', {day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})"></span>
          </div>
        </template>
      </div>
    </template>
    <template x-if="!dashB2B?.recent_incidents || dashB2B.recent_incidents.length === 0">
      <div class="empty-state" style="padding:24px 12px">
        <div class="empty-state__icon"><i data-lucide="shield" class="icon icon--xl"></i></div>
        <p class="empty-state__text">Niciun incident detectat încă.<br>Sistemul monitorizează — alertele apar aici automat.</p>
      </div>
    </template>
  </div>

  <!-- Distribuție material -->
  <template x-if="dashB2B?.material_distribution?.length > 0">
    <div class="card mb-4">
      <h3 class="section-title" style="font-size:14px;margin-bottom:14px">Tipuri de deșeuri detectate</h3>
      <div class="flex-col gap-3">
        <template x-for="m in dashB2B.material_distribution" :key="m.material">
          <div style="display:flex;align-items:center;gap:10px">
            <span style="width:72px;font-size:12px;font-weight:600;text-transform:capitalize;flex-shrink:0" x-text="m.material"></span>
            <div style="flex:1;height:8px;background:var(--bg-border);border-radius:99px;overflow:hidden">
              <div style="height:100%;background:var(--eco-green-dark);border-radius:99px;transition:width .6s ease"
                :style="`width:${dashB2B.incidents_month > 0 ? (m.count / dashB2B.incidents_month * 100).toFixed(0) : 0}%`"></div>
            </div>
            <span class="text-xs text-muted" style="width:32px;text-align:right;flex-shrink:0" x-text="m.count"></span>
          </div>
        </template>
      </div>
    </div>
  </template>

  <!-- Quick actions -->
  <div class="dash-actions" style="margin-top:20px">
    <button @click="goTo('scan')" class="btn btn--brand btn--lg" style="min-width:200px">
      <i data-lucide="video" class="icon icon--md"></i>
      Pornește monitorizarea
    </button>
    <button @click="goTo('reports')" class="btn btn--ghost">
      <i data-lucide="file-text" class="icon icon--sm"></i> Export raport
    </button>
  </div>

</div>
