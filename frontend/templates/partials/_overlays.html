<!-- Loader (shown during auth check) -->
<div x-show="authLoading" x-cloak class="td-loader">
  <div class="td-loader__core-wrap">
    <div class="td-loader__wave"></div>
    <div class="td-loader__wave" style="animation-delay:0.8s"></div>
    <div class="td-loader__wave" style="animation-delay:1.6s"></div>
    <div class="td-loader__orbit"></div>
    <div class="td-loader__core">
      <div class="td-loader__scan-line"></div>
      <div class="td-loader__dot"></div>
      <span class="td-logo__c td-logo__c--tl"></span>
      <span class="td-logo__c td-logo__c--tr"></span>
      <span class="td-logo__c td-logo__c--bl"></span>
      <span class="td-logo__c td-logo__c--br"></span>
    </div>
  </div>
  <p class="td-loader__label">Se autentifică…</p>
  <p class="td-loader__sub">TrashDet Intelligence Engine</p>
</div>

<!-- Toast notifications -->
<div class="toast-container">
  <template x-for="toast in toasts" :key="toast.id">
    <div x-show="toast.visible"
      x-transition:enter="transition ease-out duration-300"
      x-transition:enter-start="opacity-0 translate-x-8"
      x-transition:enter-end="opacity-100 translate-x-0"
      x-transition:leave="transition ease-in duration-200"
      x-transition:leave-start="opacity-100"
      x-transition:leave-end="opacity-0"
      :class="toast.type === 'error' ? 'toast toast--error' : 'toast toast--success'">
      <span style="font-weight:800;font-size:14px;flex-shrink:0">
        <template x-if="toast.type === 'error'"><i data-lucide="x" class="icon icon--sm"></i></template>
        <template x-if="toast.type !== 'error'"><i data-lucide="check" class="icon icon--sm"></i></template>
      </span>
      <span x-text="toast.message"></span>
    </div>
  </template>
</div>

<!-- ── Invite user modal (admin → adaugă membru în org) ──────────────── -->
<div x-show="inviteModalOpen" x-cloak
  @click="inviteModalOpen=false"
  @keydown.escape.window="inviteModalOpen=false"
  style="position:fixed;inset:0;z-index:7500;display:flex;align-items:center;justify-content:center;padding:16px;
         background:rgba(0,0,0,.65);backdrop-filter:blur(6px)"
  x-transition:enter="transition ease-out duration-150"
  x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100">
  <div @click.stop
    style="max-width:440px;width:100%;border-radius:20px;padding:28px;background:var(--bg-surface);
           border:1px solid var(--bg-border);box-shadow:0 24px 64px rgba(0,0,0,.4)">

    <!-- Header -->
    <div style="display:flex;align-items:center;gap:14px;margin-bottom:20px">
      <div style="width:44px;height:44px;border-radius:12px;background:rgba(5,150,105,.12);display:flex;align-items:center;justify-content:center">
        <i data-lucide="user-plus" style="width:22px;height:22px;color:#059669"></i>
      </div>
      <div>
        <p style="font-size:16px;font-weight:800;color:var(--tx-primary);margin:0">Invită membru</p>
        <p style="font-size:12px;color:var(--tx-muted);margin:2px 0 0">Adaugă un coleg în organizația ta</p>
      </div>
    </div>

    <!-- Form -->
    <template x-if="!inviteResult">
      <div>
        <div style="margin-bottom:12px">
          <label style="display:block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--tx-secondary);margin-bottom:5px">Nume utilizator</label>
          <input x-model="inviteForm.username" type="text" placeholder="ion_popescu"
            style="width:100%;padding:10px 12px;border-radius:10px;font-size:13px;border:1.5px solid var(--bg-border);
                   background:var(--bg-raised);color:var(--tx-primary);outline:none;box-sizing:border-box"
            @focus="$el.style.borderColor='#059669'" @blur="$el.style.borderColor='var(--bg-border)'" />
        </div>
        <div style="margin-bottom:12px">
          <label style="display:block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--tx-secondary);margin-bottom:5px">Email</label>
          <input x-model="inviteForm.email" type="email" placeholder="ion@companie.ro"
            style="width:100%;padding:10px 12px;border-radius:10px;font-size:13px;border:1.5px solid var(--bg-border);
                   background:var(--bg-raised);color:var(--tx-primary);outline:none;box-sizing:border-box"
            @focus="$el.style.borderColor='#059669'" @blur="$el.style.borderColor='var(--bg-border)'" />
        </div>
        <div style="margin-bottom:18px">
          <label style="display:block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--tx-secondary);margin-bottom:5px">Rol</label>
          <select x-model="inviteForm.role"
            style="width:100%;padding:10px 12px;border-radius:10px;font-size:13px;border:1.5px solid var(--bg-border);
                   background:var(--bg-raised);color:var(--tx-primary);outline:none;cursor:pointer">
            <option value="user">Utilizator — acces limitat</option>
            <option value="admin">Administrator — control total</option>
          </select>
        </div>
        <div style="display:flex;gap:10px">
          <button @click="inviteModalOpen=false"
            style="flex:1;padding:11px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;
                   background:transparent;border:1px solid var(--bg-border);color:var(--tx-secondary)">
            Anulează
          </button>
          <button @click="sendInvite()" :disabled="inviteSending"
            style="flex:1;padding:11px;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;border:none;
                   background:linear-gradient(135deg,#059669,#047857);color:#fff"
            :style="inviteSending ? 'opacity:.6;cursor:not-allowed' : ''">
            <span x-text="inviteSending ? 'Se trimite...' : 'Trimite invitație'"></span>
          </button>
        </div>
      </div>
    </template>

    <!-- Success — show temporary password -->
    <template x-if="inviteResult">
      <div>
        <div style="background:rgba(5,150,105,.08);border:1px solid rgba(5,150,105,.2);border-radius:12px;padding:14px;margin-bottom:14px">
          <p style="font-size:12px;font-weight:700;color:#059669;margin:0 0 4px">✓ Utilizator creat cu succes</p>
          <p style="font-size:12px;color:var(--tx-primary);margin:0">
            <strong x-text="inviteResult.username"></strong> · <span x-text="inviteResult.email"></span>
          </p>
        </div>
        <template x-if="inviteResult.dev_password">
          <div style="background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.3);border-radius:12px;padding:14px;margin-bottom:18px">
            <p style="font-size:11px;font-weight:700;color:#92400e;margin:0 0 6px;text-transform:uppercase;letter-spacing:.5px">Parolă temporară</p>
            <p style="font-size:12px;color:var(--tx-primary);margin:0 0 8px">Parola temporară (trimite-o utilizatorului manual):</p>
            <code style="display:block;background:var(--bg-raised);padding:10px 12px;border-radius:8px;font-size:14px;font-weight:700;font-family:monospace;color:var(--eco-green-dark);user-select:all;word-break:break-all"
              x-text="inviteResult.dev_password"></code>
          </div>
        </template>
        <button @click="inviteModalOpen=false"
          style="width:100%;padding:11px;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;border:none;
                 background:linear-gradient(135deg,#059669,#047857);color:#fff">
          Închide
        </button>
      </div>
    </template>
  </div>
</div>

<!-- ── Confirm modal universal ──────────────────────────────────────── -->
<div x-show="confirmModal.open" x-cloak
  @click="confirmModalCancel()"
  @keydown.escape.window="confirmModalCancel()"
  class="fixed inset-0 z-[500] flex items-center justify-center p-4"
  style="background:rgba(0,0,0,.65);backdrop-filter:blur(6px)"
  x-transition:enter="transition ease-out duration-150"
  x-transition:enter-start="opacity-0"
  x-transition:enter-end="opacity-100">
  <div @click.stop
    class="w-full rounded-2xl overflow-hidden"
    style="max-width:360px;background:var(--bg-surface);border:1px solid var(--bg-border);box-shadow:0 24px 64px rgba(0,0,0,.4)"
    x-transition:enter="transition ease-out duration-200"
    x-transition:enter-start="opacity-0 scale-95"
    x-transition:enter-end="opacity-100 scale-100">
    <div class="p-5">
      <div class="flex items-start gap-3 mb-5">
        <div class="w-10 h-10 rounded-xl flex items-center justify-center shrink-0 mt-0.5"
             :style="'background:'+confirmModal.iconColor+'20'">
          <i :data-lucide="confirmModal.icon" class="w-5 h-5"
             :style="'color:'+confirmModal.iconColor"></i>
        </div>
        <div>
          <p class="text-sm font-bold mb-1" style="color:var(--tx-primary)"
             x-text="confirmModal.title"></p>
          <p class="text-xs leading-relaxed" style="color:var(--tx-muted)"
             x-text="confirmModal.message"></p>
        </div>
      </div>
      <div class="flex gap-2">
        <button @click="confirmModalCancel()"
          class="flex-1 py-2.5 rounded-xl text-sm font-semibold transition-all"
          style="background:var(--bg-raised);border:1px solid var(--bg-border);color:var(--tx-secondary)"
          @mouseenter="$el.style.borderColor='var(--tx-muted)'"
          @mouseleave="$el.style.borderColor='var(--bg-border)'"
          x-text="confirmModal.cancelText">
        </button>
        <button @click="confirmModalAccept()"
          class="flex-1 py-2.5 rounded-xl text-sm font-bold transition-all"
          :style="'background:'+confirmModal.confirmColor+';color:#fff'"
          @mouseenter="$el.style.opacity='.85'"
          @mouseleave="$el.style.opacity='1'"
          x-text="confirmModal.confirmText">
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Image lightbox -->
<div x-show="lightboxSrc" x-cloak
  x-transition:enter="transition ease-out duration-200"
  x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100"
  @click="closeLightbox()" @keydown.escape.window="closeLightbox()"
  class="lightbox">
  <img :src="lightboxSrc" @click.stop />
  <button @click="closeLightbox()" class="lightbox__close"><i data-lucide="x" class="icon icon--md"></i></button>
</div>
