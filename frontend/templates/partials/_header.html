<!-- Trial banner — visible only when org is on trial plan -->
<div x-show="isLoggedIn && org?.plan === 'trial'" x-cloak
  style="background:rgba(245,158,11,.12);border-bottom:1px solid rgba(245,158,11,.25);padding:7px 16px;display:flex;align-items:center;gap:10px;font-size:12px">
  <i data-lucide="clock" style="width:14px;height:14px;color:#f59e0b;flex-shrink:0"></i>
  <span :style="darkMode ? 'color:#fbbf24' : 'color:#92400e'">
    <template x-if="org?.trial_days_left > 0">
      <span>Trial activ — mai ai <strong x-text="org.trial_days_left"></strong> zile. Upgrade pentru acces complet.</span>
    </template>
    <template x-if="org?.trial_days_left === 0">
      <span style="font-weight:700">Trial expirat. Activează un plan pentru a continua.</span>
    </template>
  </span>
  <button @click="activatePlan('pro')"
    style="margin-left:auto;background:#f59e0b;color:#fff;padding:3px 12px;border-radius:20px;font-weight:700;font-size:11px;white-space:nowrap;border:none;cursor:pointer">
    Activează acum →
  </button>
</div>

<!-- Top header bar -->
<header class="td-header">
  <button @click="sidebarOpen = !sidebarOpen" class="td-header__hamburger">
    <i data-lucide="menu" class="icon icon--lg"></i>
  </button>

  <span class="td-header__title" x-text="tabs.find(t=>t.id===activeTab)?.label ?? ''"></span>

  <span style="flex:1"></span>

  <!-- Back to site when not logged in -->
  <a x-show="!isLoggedIn" x-cloak href="/"
    style="font-size:12px;font-weight:600;color:var(--tx-muted);text-decoration:none;
           padding:5px 12px;border-radius:8px;border:1px solid var(--bg-border);
           display:flex;align-items:center;gap:5px;margin-right:8px;transition:all .15s"
    onmouseover="this.style.color='var(--tx-primary)';this.style.borderColor='var(--tx-muted)'"
    onmouseout="this.style.color='var(--tx-muted)';this.style.borderColor='var(--bg-border)'">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    Site
  </a>

  <!-- Notification bell -->
  <div x-show="isLoggedIn" x-cloak class="notif-wrapper">
    <button @click="notifOpen = !notifOpen" class="td-header__dark-btn notif-bell" title="Notifications">
      <i data-lucide="bell" class="icon icon--md"></i>
      <span x-show="unreadNotifications > 0" x-cloak class="notif-badge"
        x-text="unreadNotifications > 9 ? '9+' : unreadNotifications"></span>
    </button>

    <!-- Notification panel -->
    <div x-show="notifOpen" x-cloak @click.outside="notifOpen=false"
      x-transition:enter="transition ease-out duration-150"
      x-transition:enter-start="opacity-0 scale-95"
      x-transition:enter-end="opacity-100 scale-100"
      class="notif-panel">
      <div class="notif-panel__header">
        <span class="notif-panel__title">Notificări</span>
        <button x-show="unreadNotifications > 0" @click="markAllRead()" class="notif-panel__mark-read">Marchează citite</button>
      </div>
      <div class="notif-panel__list">
        <template x-if="notifications.filter(n => n.category !== 'rank_up' && n.category !== 'streak' && n.category !== 'badge').length === 0">
          <div class="notif-panel__empty">Nicio notificare</div>
        </template>
        <template x-for="n in notifications.filter(n => n.category !== 'rank_up' && n.category !== 'streak' && n.category !== 'badge')" :key="n.id">
          <div @click="markRead(n); if(n.category==='alert') goTo('incidents')"
            :class="'notif-item' + (n.is_read ? '' : ' notif-item--unread')">
            <span class="notif-item__icon">
              <i :data-lucide="({
                alert:'alert-triangle', incident:'alert-triangle',
                forwarded:'send', resolved:'check-circle',
                broadcast:'megaphone', motivation:'bell-ring',
                verified:'badge-check', rejected:'x-circle',
              })[n.category] || 'bell'" class="icon icon--md"></i>
            </span>
            <div class="notif-item__body">
              <p class="notif-item__message" x-text="n.message"></p>
              <p class="notif-item__time" x-text="formatNotifDate(n.created_at)"></p>
            </div>
            <span x-show="!n.is_read" class="notif-item__dot"></span>
          </div>
        </template>
      </div>
    </div>
  </div>

  <button @click="toggleDark()" class="td-header__dark-btn" :title="darkMode ? 'Light mode' : 'Dark mode'">
    <i x-show="!darkMode" data-lucide="moon" class="icon icon--md"></i>
    <i x-show="darkMode" x-cloak data-lucide="sun" class="icon icon--md"></i>
  </button>

</header>
